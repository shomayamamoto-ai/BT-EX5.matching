<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>無料会員登録 | 交流会マッチング</title>
  <link rel="icon" type="image/svg+xml" href="../assets/bt-ex5-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap"></noscript>
  <link rel="stylesheet" href="../auth/auth.css">
</head>
<body>
  <main class="auth-main">
    <div class="auth-card">
      <a href="../login/" class="auth-logo">
        <img class="brand-mark" src="../assets/bt-ex5-mark.svg" alt="" width="40" height="40">
        <span class="brand-word"><span class="brand-name">BT-<em>EX5</em></span><span class="brand-sub">新潟・東京 紹介者制コミュニティ</span></span>
      </a>

      <h1>無料会員登録</h1>
      <p class="auth-lead">登録するとすぐにメンバー検索・マッチングをご利用いただけます。</p>

      <form id="register-form" novalidate>
        <div class="auth-field">
          <label for="register-name">お名前</label>
          <input type="text" id="register-name" name="name" autocomplete="name" required>
        </div>
        <div class="auth-field">
          <label for="register-email">メールアドレス</label>
          <input type="email" id="register-email" name="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="register-password">パスワード(12文字以上)</label>
          <div class="password-row">
            <input type="password" id="register-password" name="password" autocomplete="new-password" required>
            <button type="button" id="password-toggle" class="password-toggle" aria-pressed="false" aria-label="パスワードを表示">表示</button>
          </div>
        </div>
        <div class="auth-field">
          <label for="register-category">業種</label>
          <select id="register-category" name="category">
            <option value="経営者">経営者</option>
            <option value="エンジニア">エンジニア</option>
            <option value="クリエイター">クリエイター</option>
            <option value="マーケター">マーケター</option>
            <option value="飲食">飲食</option>
            <option value="美容・健康">美容・健康</option>
            <option value="士業・コンサル">士業・コンサル</option>
            <option value="不動産・金融">不動産・金融</option>
          </select>
        </div>
        <div class="auth-field">
          <label for="register-bio">ひとことアピール(任意)</label>
          <textarea id="register-bio" name="bio" rows="2"></textarea>
        </div>

        <button type="submit" id="register-submit" class="auth-submit" aria-busy="false">登録してはじめる</button>
        <div id="register-message" class="auth-message"></div>
      </form>

      <div class="auth-links">
        <a href="../login/">すでに会員の方はログイン</a>
      </div>

      <p class="demo-note">デモ環境のため、登録情報はお使いのブラウザ内にのみ保存されます。</p>
    </div>
  </main>

  <footer class="auth-footer">
    <a href="../terms/">利用規約</a><a href="../privacy/">プライバシーポリシー</a>
  </footer>

  <script src="../auth/mock-server.js"></script>
  <script src="../auth/api.js"></script>
  <script src="../auth/session.js"></script>
  <script src="../auth/ui.js"></script>
  <script src="../auth/register.js"></script>
</body>
</html>
