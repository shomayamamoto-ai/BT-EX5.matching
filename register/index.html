<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>無料会員登録 | 交流会マッチング</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b5342c'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%23fffdf7' font-family='sans-serif'>縁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"></noscript>
  <link rel="stylesheet" href="../auth/auth.css">
</head>
<body>
  <main class="auth-main">
    <div class="auth-card">
      <a href="../login/" class="auth-logo">
        <span class="auth-logo-mark">縁</span>
        <span>交流会マッチング</span>
      </a>

      <h1>無料会員登録</h1>
      <p class="auth-lead">登録するとすぐにメンバー検索・マッチングをご利用いただけます。</p>

      <form id="register-form" novalidate>
        <div class="auth-field">
          <label for="register-name">お名前</label>
          <input type="text" id="register-name" name="name" autocomplete="name" required>
        </div>
        <div class="auth-field">
          <label for="register-email">メールアドレス</label>
          <input type="email" id="register-email" name="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="register-password">パスワード(12文字以上)</label>
          <div class="password-row">
            <input type="password" id="register-password" name="password" autocomplete="new-password" required>
            <button type="button" id="password-toggle" class="password-toggle" aria-pressed="false" aria-label="パスワードを表示">表示</button>
          </div>
        </div>

        <button type="submit" id="register-submit" class="auth-submit" aria-busy="false">登録してはじめる</button>
        <div id="register-message" class="auth-message"></div>
      </form>

      <div class="auth-links">
        <a href="../login/">すでに会員の方はログイン</a>
      </div>

      <p class="demo-note">デモ環境のため、登録情報はお使いのブラウザ内にのみ保存されます。</p>
    </div>
  </main>

  <footer class="auth-footer">
    <a href="../terms/">利用規約</a><a href="../privacy/">プライバシーポリシー</a>
  </footer>

  <script src="../auth/mock-server.js"></script>
  <script src="../auth/api.js"></script>
  <script src="../auth/session.js"></script>
  <script src="../auth/ui.js"></script>
  <script src="../auth/register.js"></script>
</body>
</html>
