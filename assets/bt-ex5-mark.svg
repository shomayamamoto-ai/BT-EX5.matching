<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BT-EX5">
  <!-- ご縁(5円)のコイン。中央の穴のまわりに5つの点(チーム5)を、赤い糸(縁)で結ぶ -->
  <defs>
    <linearGradient id="cn-face" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.35" stop-color="#f6cf6a"/>
      <stop offset="0.7" stop-color="#dba23a"/>
      <stop offset="1" stop-color="#b9781f"/>
    </linearGradient>
    <linearGradient id="cn-rim" x1="54" y1="58" x2="10" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#c58a2a"/>
      <stop offset="1" stop-color="#8f5a14"/>
    </linearGradient>
    <linearGradient id="cn-hole" x1="27" y1="27" x2="37" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f5a14"/>
      <stop offset="1" stop-color="#fff0b8"/>
    </linearGradient>
    <mask id="cn-cut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="6.4" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#cn-cut)">
    <!-- 面と縁 -->
    <circle cx="32" cy="32" r="29" fill="url(#cn-face)"/>
    <circle cx="32" cy="32" r="27.4" fill="none" stroke="url(#cn-rim)" stroke-width="2.4"/>
    <circle cx="32" cy="32" r="24.6" fill="none" stroke="#9a6418" stroke-opacity="0.35" stroke-width="0.7"/>
    <!-- 光の反射 -->
    <path d="M12.5 22a21.5 21.5 0 0 1 17-13.4" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round"/>
    <!-- 赤い糸で結ぶ5つの点 -->
    <path d="M32 15.2 48 26.8 41.9 45.6H22.1L16 26.8Z" fill="none" stroke="#d8402a" stroke-width="2.1" stroke-linejoin="round"/>
    <g fill="#fff8e6" stroke="#d8402a" stroke-width="1.4">
      <circle cx="32" cy="15.2" r="3"/>
      <circle cx="48" cy="26.8" r="3"/>
      <circle cx="41.9" cy="45.6" r="3"/>
      <circle cx="22.1" cy="45.6" r="3"/>
      <circle cx="16" cy="26.8" r="3"/>
    </g>
  </g>
  <!-- 穴の内側の段差 -->
  <circle cx="32" cy="32" r="7.1" fill="none" stroke="url(#cn-hole)" stroke-width="1.4"/>
</svg>
