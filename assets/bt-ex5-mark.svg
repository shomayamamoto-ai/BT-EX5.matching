<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BT-EX5">
  <!-- 5つの点を1本の糸で結んだ五角形。紹介が人から人へ巡る様子(オープニングムービーの結び目) -->
  <defs>
    <linearGradient id="mk-tile" x1="8" y1="2" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2219"/>
      <stop offset="1" stop-color="#140b09"/>
    </linearGradient>
    <linearGradient id="mk-thread" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a52"/>
      <stop offset="0.55" stop-color="#f4694b"/>
      <stop offset="1" stop-color="#ffbe4d"/>
    </linearGradient>
    <radialGradient id="mk-glow" cx="32" cy="14.2" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mk-streak" x1="49.3" y1="26.8" x2="42.7" y2="47.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff4dc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff4dc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="mk-edge" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#mk-tile)"/>
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="14.4" fill="none" stroke="url(#mk-edge)" stroke-width="1.2"/>
  <circle cx="32" cy="14.2" r="11" fill="url(#mk-glow)"/>
  <path d="M32 14.2 49.3 26.8 42.7 47.2H21.3L14.7 26.8Z" fill="none" stroke="url(#mk-thread)" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- 糸の上を巡る光 -->
  <path d="M49.3 26.8 42.7 47.2" stroke="url(#mk-streak)" stroke-width="3.4" stroke-linecap="round"/>
  <g fill="#fff8ec" stroke="#1c100c" stroke-width="1.2">
    <circle cx="49.3" cy="26.8" r="3.5"/>
    <circle cx="42.7" cy="47.2" r="3.5"/>
    <circle cx="21.3" cy="47.2" r="3.5"/>
    <circle cx="14.7" cy="26.8" r="3.5"/>
  </g>
  <circle cx="32" cy="14.2" r="4.6" fill="#fff8ec" stroke="#ffbe4d" stroke-width="1.6"/>
</svg>
