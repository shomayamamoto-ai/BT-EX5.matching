<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>パスワード再設定 | 交流会マッチング</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/bt-ex5-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap"></noscript>
  <link rel="stylesheet" href="../../auth/auth.css">
</head>
<body>
  <main class="auth-main">
    <div class="auth-card">
      <a href="../../" class="auth-logo">
        <img class="brand-mark" src="../../assets/bt-ex5-mark.svg" alt="" width="40" height="40">
        <span class="brand-word"><span class="brand-name">BT-<em>EX5</em></span><span class="brand-sub">新潟・東京 紹介者制コミュニティ</span></span>
      </a>

      <h1>パスワード再設定</h1>
      <p class="auth-lead">登録済みのメールアドレスを入力してください。</p>

      <form id="reset-form" novalidate>
        <div class="auth-field">
          <label for="reset-email">メールアドレス</label>
          <input type="email" id="reset-email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" id="reset-submit" class="auth-submit" aria-busy="false">再設定メールを送信</button>
        <div id="reset-message" class="auth-message"></div>
      </form>

      <div class="auth-links">
        <a href="../../login/">ログインに戻る</a>
      </div>
    </div>
  </main>

  <footer class="auth-footer">
    <a href="../../terms/">利用規約</a><a href="../../privacy/">プライバシーポリシー</a>
  </footer>

  <script src="../../auth/mock-server.js"></script>
  <script src="../../auth/api.js"></script>
  <script src="../../auth/session.js"></script>
  <script src="../../auth/ui.js"></script>
  <script src="../../auth/reset.js"></script>
</body>
</html>
