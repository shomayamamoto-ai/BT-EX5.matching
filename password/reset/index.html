<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>パスワード再設定 | 交流会マッチング</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff5e7e'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%23fffdf7' font-family='sans-serif'>縁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap"></noscript>
  <link rel="stylesheet" href="../../auth/auth.css">
</head>
<body>
  <main class="auth-main">
    <div class="auth-card">
      <a href="../../" class="auth-logo">
        <span class="auth-logo-mark">縁</span>
        <span>交流会マッチング</span>
      </a>

      <h1>パスワード再設定</h1>
      <p class="auth-lead">登録済みのメールアドレスを入力してください。</p>

      <form id="reset-form" novalidate>
        <div class="auth-field">
          <label for="reset-email">メールアドレス</label>
          <input type="email" id="reset-email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" id="reset-submit" class="auth-submit" aria-busy="false">再設定メールを送信</button>
        <div id="reset-message" class="auth-message"></div>
      </form>

      <div class="auth-links">
        <a href="../../login/">ログインに戻る</a>
      </div>
    </div>
  </main>

  <footer class="auth-footer">
    <a href="../../terms/">利用規約</a><a href="../../privacy/">プライバシーポリシー</a>
  </footer>

  <script src="../../auth/mock-server.js"></script>
  <script src="../../auth/api.js"></script>
  <script src="../../auth/session.js"></script>
  <script src="../../auth/ui.js"></script>
  <script src="../../auth/reset.js"></script>
</body>
</html>
