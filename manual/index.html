<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf6f4">
  <title>BT-EX5 使い方マニュアル</title>
  <!-- BT-EX5 使い方マニュアルの入口。パソコン版(pc.html)かスマホ版(sp.html)を選ぶ。いま見ている端末に合うほうに「おすすめ」を付ける -->
  <link rel="icon" type="image/svg+xml" href="../assets/bt-ex5-mark.svg?v=202611100246">
  <link rel="apple-touch-icon" href="../assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@700;800&display=swap">
  <link rel="stylesheet" href="manual.css?v=202611100246">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="back" href="../app/" data-back aria-label="戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>戻る</span></a>
      <a class="brand" href="./"><img src="../assets/bt-ex5-mark.svg?v=202611100246" alt=""><b>BT-<span>EX5</span></b></a>
      <a class="open" href="../app/">アプリを開く</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="en">How to use</p>
      <h1>BT-EX5 使い方マニュアル</h1>
      <p>お使いの機械を選んでください。どちらも、絵と動画で順番に説明しています。</p>
    </section>

    <nav class="choose" aria-label="マニュアルを選ぶ">
      <a href="sp.html" id="pickSp">
        <span class="rec" hidden>おすすめ</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="4" width="28" height="56" rx="6"/><path d="M28 9h8"/><circle cx="32" cy="53" r="2"/></svg>
        <b>スマホ版</b>
        <small>iPhone・Android で使う方へ<br>ホーム画面への追加・通知のしかたも</small>
        <span class="go">スマホ版を見る</span>
      </a>
      <a href="pc.html" id="pickPc">
        <span class="rec" hidden>おすすめ</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="9" y="12" width="46" height="30" rx="3"/><path d="M4 50h56l-4-8H8z"/><path d="M28 46h8"/></svg>
        <b>パソコン版</b>
        <small>Windows・Mac で使う方へ<br>定例会のプレゼン進行・資料づくりも</small>
        <span class="go">パソコン版を見る</span>
      </a>
    </nav>

    <footer class="foot">
      <div class="links"><a href="../app/">アプリを開く</a><a href="../app/#help">よくある質問(アプリ内)</a></div>
      <p>© 2026 BT-EX5 ・ 新潟 ⇔ 東京 紹介者制コミュニティ</p>
    </footer>
  </main>
  <script src="manual.js?v=202611100246"></script>
  <script>
    // いま見ている機械に合うほうに「おすすめ」を付ける(指で操作する小さい画面ならスマホ)
    (function () {
      var phone = window.matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 820;
      var el = document.querySelector((phone ? "#pickSp" : "#pickPc") + " .rec");
      if (el) el.hidden = false;
    })();
  </script>
</body>
</html>
