<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>BT-EX5 マスコット</title>
  <!-- BT-EX5 のマスコット(3D)。トキの「ときめ」と、上越新幹線 E7系の「つなぐ」(オープニングムービーと同じ、本物に近い形)。
       指(マウス)で回せる・「分解して見る」で部品に分かれる・「動かす」で羽ばたき・車輪が回る・「画像で保存」で PNG にできる。
       URL の ? のあとで: c=toki / train / both(はじめに出すキャラ)、bg=dark / soft(背景)、explode=1(分解した形)、still=1(止めた形)、embed=1(ボタンなし)、bare=1(背景なし) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@700;800&display=swap">
  <style>
    :root { --gold:#d9b46a; --ink:#f3ebe0; --sub:rgba(243,235,224,.66); --panel:rgba(20,18,18,.55); --line:rgba(217,180,106,.38);
      --mincho:"Shippori Mincho","Noto Serif CJK JP",serif; --sans:"Noto Sans JP","Noto Sans CJK JP",sans-serif; --en:"Cormorant Garamond",serif; }
    body.is-soft { --ink:#3a2a24; --sub:rgba(58,42,36,.7); --panel:rgba(255,255,255,.62); --line:rgba(180,110,90,.35); --gold:#b4774a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; background:#1c1b1d; }
    body { font-family:var(--sans); color:var(--ink); -webkit-tap-highlight-color:transparent; }
    body.is-soft { background:#f6e9e3; }
    canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
    .brand { position:fixed; left:clamp(16px,3vw,36px); top:clamp(14px,3vh,30px); pointer-events:none; }
    .brand p { font:600 italic clamp(13px,1.4vw,16px)/1 var(--en); letter-spacing:.32em; color:var(--gold); }
    .brand h1 { margin-top:8px; font:800 clamp(26px,3.4vw,44px)/1.15 var(--mincho); letter-spacing:.06em; }
    .brand h1 small { display:block; margin-top:6px; font:500 clamp(12px,1.2vw,14px)/1.6 var(--sans); letter-spacing:.08em; color:var(--sub); max-width:22em; }
    .labels { position:fixed; inset:0; pointer-events:none; }
    .lab { position:absolute; left:0; top:0; display:flex; align-items:center; gap:10px; opacity:0; transition:opacity .4s; white-space:nowrap; will-change:transform; }
    .lab.is-on { opacity:1; }
    .lab i { width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px rgba(217,180,106,.18); flex:none; }
    .lab span { padding:7px 12px 8px; border-left:1px solid var(--line); background:var(--panel); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:2px 8px 8px 2px; }
    .lab b { display:block; font:700 13px/1.2 var(--mincho); letter-spacing:.08em; }
    .lab b em { font:600 italic 12px/1 var(--en); color:var(--gold); margin-right:6px; font-style:italic; }
    .lab small { display:block; margin-top:3px; font:500 10.5px/1.3 var(--sans); letter-spacing:.1em; color:var(--sub); }
    .bar { width:max-content; position:fixed; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:8px; border-radius:999px; background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 0 0 1px var(--line); max-width:calc(100vw - 24px); }
    .bar button { appearance:none; border:0; border-radius:999px; padding:10px 13px; font:700 13px/1 var(--sans); letter-spacing:.06em; color:var(--ink); background:transparent; cursor:pointer; }
    .bar button[aria-pressed="true"] { background:linear-gradient(135deg,#e7c27a,#b98a3e); color:#1c1408; }
    .bar .sep { width:1px; background:var(--line); margin:4px 2px; }
    .hint { position:fixed; right:clamp(16px,3vw,36px); top:clamp(18px,3vh,34px); font:500 11px/1.6 var(--sans); letter-spacing:.12em; color:var(--sub); text-align:right; pointer-events:none; }
    body.is-embed .bar, body.is-embed .hint { display:none; }
    @media (max-width:640px) { .bar { border-radius:20px; width:calc(100vw - 24px); gap:4px; } .bar .sep { display:none; } .bar button { padding:9px 10px; font-size:12px; } .hint { display:none; } .lab small { display:none; } }
  </style>
  <script type="importmap">{ "imports": { "three": "../../assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="labels" id="labels"></div>
  <div class="brand"><p>BT-EX5 MASCOT</p><h1 id="name"></h1></div>
  <p class="hint">ドラッグで回す ・ ピンチ/ホイールで拡大</p>
  <nav class="bar" aria-label="操作">
    <button type="button" data-c="toki">トキ</button>
    <button type="button" data-c="train">新幹線</button>
    <button type="button" data-c="both">ふたり</button>
    <span class="sep"></span>
    <button type="button" id="explodeBtn" aria-pressed="false">分解して見る</button>
    <button type="button" id="moveBtn" aria-pressed="true">動かす</button>
    <button type="button" id="spinBtn" aria-pressed="true">回す</button>
    <button type="button" id="bgBtn">背景</button>
    <button type="button" id="saveBtn">画像で保存</button>
  </nav>

  <script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "../../assets/vendor/three/OrbitControls.js";
  import { RoomEnvironment } from "../../assets/vendor/three/RoomEnvironment.js";

  const q = new URLSearchParams(location.search);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const TAU = Math.PI * 2;
  document.body.classList.toggle("is-embed", q.get("embed") === "1");

  // ---------- レンダラー・カメラ ----------
  const canvas = document.getElementById("c");
  // bare=1: 台座なし・背景なし(すき通し)で、キャラクターだけを出す(資料のポスター・お誘い画像に使う切り抜き用)
  const bare = q.get("bare") === "1";
  if (bare) document.documentElement.style.background = document.body.style.background = "transparent";
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: bare });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 2.5; controls.maxDistance = 20;
  controls.maxPolarAngle = Math.PI * 0.52;

  const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
  key.position.set(-4, 7, 5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
  key.shadow.radius = 6; key.shadow.bias = -0.0004;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xbcd2ff, 1.3); rim.position.set(5, 4, -6); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xfff6ee, 0x2a2420, 0.35));
  const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.ShadowMaterial({ opacity: 0.45 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // ---------- 背景 ----------
  function bgTexture(soft) {
    const c = document.createElement("canvas"); c.width = 1024; c.height = 1024;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(512, 420, 40, 512, 520, 760);
    if (soft) { gr.addColorStop(0, "#fff8f3"); gr.addColorStop(0.55, "#f8e4dc"); gr.addColorStop(1, "#e9cfc6"); }
    else { gr.addColorStop(0, "#3a383b"); gr.addColorStop(0.5, "#262527"); gr.addColorStop(1, "#151416"); }
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
  let soft = q.get("bg") === "soft";
  function applyBg() {
    if (bare) { scene.background = null; floor.visible = false; return; }
    scene.background = bgTexture(soft);
    floor.material.opacity = soft ? 0.2 : 0.45;
    document.body.classList.toggle("is-soft", soft);
  }
  applyBg();

  // ---------- 形と質感(オープニングムービーと同じ作り) ----------
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
  function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
// ================= 本物に近いトキ(朱鷺)と上越新幹線(E7系) =================
// トキ: 全長約75cm・翼を広げて約140cm。体は白く、風切羽と尾羽の裏は朱鷺色(淡い橙赤色)で、飛ぶと翼の下がとくに鮮やか。
//       顔の皮膚は赤、くちばしは黒く下に曲がり先が赤い。後頭部に細長い冠羽。脚は赤く、飛ぶときは首を前に伸ばし脚をうしろへ伸ばす。
// E7系: 白い車体に青い屋根と先頭の上、窓の下に青の帯と銅色の線(上越新幹線では朱鷺色の線も)。12両編成(ここでは先頭から5両)。

// 表と裏で色がちがう羽(表は白、裏は朱鷺色)
function twoTone(top, bottom, o) {
  const m = new THREE.MeshStandardMaterial(Object.assign({ color: 0xffffff, roughness: 0.8, metalness: 0, side: THREE.DoubleSide }, o || {}));
  const cT = new THREE.Color(top), cB = new THREE.Color(bottom);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.cTop = { value: cT }; sh.uniforms.cBot = { value: cB };
    sh.fragmentShader = 'uniform vec3 cTop; uniform vec3 cBot;\n' + sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\n  diffuseColor.rgb *= gl_FrontFacing ? cTop : cBot;')
      // 羽は光を少し透かす(下から見ても、翼の裏の朱鷺色が明るく見える)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n  if (!gl_FrontFacing) totalEmissiveRadiance += diffuseColor.rgb * 0.38;');
  };
  return m;
}
// 羽毛のこまかな凹凸(体・首の質感)
function plumeBump() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, 512, 512);
  for (let row = 0; row < 30; row++) for (let k = 0; k < 24; k++) {
    const x = k * 22 + (row % 2) * 11 + (hash(row, k) - 0.5) * 6, y = row * 18 + (hash(k, row) - 0.5) * 5;
    const gr = g.createRadialGradient(x, y - 5, 1, x, y - 2, 15); gr.addColorStop(0, '#b4b4b4'); gr.addColorStop(0.75, '#868686'); gr.addColorStop(1, '#5c5c5c');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 11, 14, 0, 0, TAU); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const PLUME = plumeBump();
// 先細りの管(首・くちばし・冠羽・脚)。three.js の TubeGeometry と同じ向きで面を張る
function taperGeo(curve, rFn, segs = 48, radial = 16, colFn) {
  const fr = curve.computeFrenetFrames(segs, false), pos = [], col = [], idx = [], P = new THREE.Vector3(), cc = new THREE.Color();
  for (let i = 0; i <= segs; i++) {
    const s = i / segs; curve.getPointAt(s, P); const r = rFn(s), N = fr.normals[i], B = fr.binormals[i];
    for (let j = 0; j <= radial; j++) {
      const v = (j / radial) * TAU, sn = Math.sin(v), cs = -Math.cos(v);
      pos.push(P.x + r * (cs * N.x + sn * B.x), P.y + r * (cs * N.y + sn * B.y), P.z + r * (cs * N.z + sn * B.z));
      if (colFn) { colFn(s, cc); col.push(cc.r, cc.g, cc.b); }
    }
  }
  for (let i = 1; i <= segs; i++) for (let j = 1; j <= radial; j++) {
    const a = (radial + 1) * (i - 1) + (j - 1), b = (radial + 1) * i + (j - 1), c = (radial + 1) * i + j, d = (radial + 1) * (i - 1) + j;
    idx.push(a, b, d, b, c, d);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (colFn) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const curveOf = (pts) => new THREE.CatmullRomCurve3(pts.map((p) => V(p[0], p[1], p[2])));
// 1枚の羽(根元が原点、+x へ伸びる。表が +y)。先は丸く、外側の初列風切は先のほうがくびれる
function featherGeom(len, wid, o = {}) {
  const nL = 14, nW = 4, asym = o.asym || 0, curl = o.curl || 0, notch = o.notch || 0, pos = [], col = [], idx = [];
  const cBase = new THREE.Color(o.base || 0xffffff), cTip = new THREE.Color(o.tip || 0xffffff), c = new THREE.Color();
  for (let i = 0; i <= nL; i++) {
    const s = i / nL;
    let w = s < 0.8 ? 0.4 + 0.6 * Math.sin((Math.PI / 2) * Math.min(1, s / 0.45)) : Math.sqrt(Math.max(0, 1 - ((s - 0.8) / 0.2) ** 2));
    if (notch && s > 0.42 && s < 0.8) w *= 1 - notch * Math.sin((Math.PI * (s - 0.42)) / 0.38);
    w *= wid * 0.5;
    for (let j = 0; j <= nW; j++) {
      const v = (j / nW) * 2 - 1;
      const y = 0.09 * wid * (1 - v * v) * Math.sin(Math.PI * Math.min(1, s * 1.1)) + curl * s * s * len;
      pos.push(s * len, y, (v + asym) * w);
      c.copy(cBase).lerp(cTip, Math.pow(s, 0.7)); col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < nL; i++) for (let j = 0; j < nW; j++) { const a = i * (nW + 1) + j, b = a + nW + 1; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

function buildRealToki() {
  const root = new THREE.Group(), parts = {};
  const bodyM = new THREE.MeshPhysicalMaterial({ color: 0xf9f2ef, roughness: 0.8, sheen: 0.8, sheenRoughness: 0.55, sheenColor: new THREE.Color(0xffd8cc), bumpMap: PLUME, bumpScale: 0.7 });
  const featherM = twoTone(0xfffbf9, 0xf0997f, { vertexColors: true });
  // 分解して見るときの部品のまとまり(胴・頭と首・尾・脚・左右の翼)
  const G = {}; ["body", "head", "tail", "legs", "wingL", "wingR"].forEach((k) => { G[k] = new THREE.Group(); root.add(G[k]); });
  let cur = G.body;
  const add = (geo, mat, parent = cur) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
  // 胴: 胸がふくらみ、尾へ細くなる流線形
  const prof = [[0, -0.8], [0.06, -0.76], [0.12, -0.66], [0.18, -0.48], [0.235, -0.2], [0.262, 0.08], [0.255, 0.3], [0.215, 0.46], [0.16, 0.58], [0.11, 0.66], [0, 0.71]].map(([r, y]) => new THREE.Vector2(r, y));
  const bg = new THREE.LatheGeometry(prof, 48); bg.rotateZ(-Math.PI / 2); bg.scale(1, 0.9, 1);
  PLUME.repeat.set(6, 3); add(bg, bodyM);
  // 首: 飛ぶときはまっすぐ前へ伸ばす
  cur = G.head;
  add(taperGeo(curveOf([[0.5, 0.05, 0], [0.8, 0.1, 0], [1.08, 0.15, 0], [1.24, 0.18, 0]]), (s) => lerp(0.11, 0.076, s), 40, 18), bodyM);
  // 頭(白い羽)と、赤い顔の皮膚、目(橙色の虹彩)
  const head = add(new THREE.SphereGeometry(0.115, 32, 24), bodyM); head.scale.set(1.22, 0.95, 0.92); head.position.set(1.28, 0.2, 0);
  const face = add(new THREE.SphereGeometry(0.085, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xd63a2f, roughness: 0.5, clearcoat: 0.35, clearcoatRoughness: 0.4 }));
  face.scale.set(1.15, 0.82, 1.12); face.position.set(1.37, 0.175, 0);
  [-1, 1].forEach((sd) => {
    const eye = add(new THREE.SphereGeometry(0.019, 16, 12), new THREE.MeshPhysicalMaterial({ color: 0xe39a2c, roughness: 0.15, clearcoat: 1 })); eye.position.set(1.35, 0.205, sd * 0.091);
    const pupil = add(new THREE.SphereGeometry(0.009, 12, 8), new THREE.MeshPhysicalMaterial({ color: 0x0c0806, roughness: 0.05, clearcoat: 1 })); pupil.position.set(1.354, 0.206, sd * 0.106);
  });
  // くちばし: 長く下へ曲がり、黒く、先だけ赤い
  const billCol = (s, c) => c.set(0x1b1715).lerp(new THREE.Color(0xc4352c), clamp((s - 0.8) / 0.08, 0, 1));
  add(taperGeo(curveOf([[1.43, 0.17, 0], [1.62, 0.145, 0], [1.82, 0.07, 0], [1.98, -0.05, 0]]), (s) => lerp(0.034, 0.007, Math.pow(s, 0.9)), 48, 14, billCol),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.32, clearcoat: 0.6 }));
  // 冠羽: 後頭部の細長い羽の束(飛ぶときはうしろへ寝かせる)
  const crestM = new THREE.MeshStandardMaterial({ color: 0xf7e3dc, roughness: 0.75 });
  for (let k = 0; k < 7; k++) {
    const zz = (k / 6 - 0.5) * 0.07, j = hash(k, 2.7), L = 0.26 + j * 0.12;
    add(taperGeo(curveOf([[1.25, 0.265, zz * 0.4], [1.12, 0.29 + j * 0.015, zz * 0.8], [1.2 - L, 0.255 - j * 0.02, zz]]), (s) => lerp(0.024, 0.003, Math.pow(s, 0.8)), 20, 8), crestM);
  }
  // 尾: 扇形の尾羽(裏は朱鷺色)
  cur = G.tail;
  for (let k = 0; k < 8; k++) {
    const a = (k - 3.5) * 0.085, L = 0.42 - Math.abs(k - 3.5) * 0.02;
    const f = add(featherGeom(L, 0.12, { base: 0xffe0d6 }), featherM); f.rotation.order = 'YZX'; f.position.set(-0.68, 0.035 + k * 0.001, (k - 3.5) * 0.02); f.rotation.set(0, Math.PI + a, 0.04);
  }
  // 脚: 赤く、うしろへ伸ばす(指も)
  cur = G.legs;
  const legM = new THREE.MeshPhysicalMaterial({ color: 0xcc4637, roughness: 0.45, clearcoat: 0.3 });
  [-1, 1].forEach((sd) => {
    const zz = sd * 0.055, end = [-0.98, -0.12, zz * 1.25];
    add(taperGeo(curveOf([[-0.15, -0.19, zz], [-0.5, -0.2, zz], end]), (s) => lerp(0.018, 0.012, s), 24, 10), legM);
    [-0.12, 0, 0.12].forEach((sp) => add(taperGeo(curveOf([end, [end[0] - 0.04, end[1] - 0.005, end[2] + sd * sp * 0.03], [end[0] - 0.08, end[1] - 0.012, end[2] + sd * sp * 0.05]]), (s) => lerp(0.009, 0.004, s), 8, 6), legM));
  });
  // 翼: 腕(次列風切・雨覆)と手(初列風切)。外側の初列風切は先が指のように分かれる
  const wings = [];
  [-1, 1].forEach((sd) => {
    const wr = new THREE.Group(); wr.position.set(0.16, 0.13, sd * 0.19); (sd < 0 ? G.wingL : G.wingR).add(wr);
    const arm = new THREE.Group(); wr.add(arm);
    const hand = new THREE.Group(); hand.position.set(0.02, 0, sd * 1.05); arm.add(hand);
    add(taperGeo(curveOf([[0.12, 0, 0], [0.1, 0.012, sd * 0.5], [0.03, 0, sd * 1.06]]), (s) => lerp(0.06, 0.04, s), 24, 12), bodyM, arm);
    add(taperGeo(curveOf([[0.02, 0, -sd * 0.02], [-0.01, 0.004, sd * 0.32], [-0.09, 0, sd * 0.58]]), (s) => lerp(0.042, 0.018, s), 20, 10), bodyM, hand);
    const place = (parent, geo, x, y, z, dx, dz, droop = 0, twist = 0) => {
      const m = add(geo, featherM, parent); m.rotation.order = 'YZX'; m.position.set(x, y, z); m.rotation.set(twist, Math.atan2(-dz, dx), droop); return m;
    };
    // 三列風切(体のそば)
    for (let i = 0; i < 3; i++) place(arm, featherGeom(0.5 - i * 0.04, 0.15, { base: 0xffe6de }), 0.06, -0.006 + i * 0.002, sd * (0.0 + i * 0.05), -1, sd * (-0.05 + i * 0.05));

    camera.fov = w < h ? 44 : 32; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", () => { resize(); frame(); }); resize(); setMode(mode);

  const clock = new THREE.Clock(); let ph = q.get("still") === "1" ? 0 : 0;
  function render() {
    const dt = Math.min(clock.getDelta(), 0.05); t += dt;
    if (move) ph += dt * TAU * 1.1;
    bird.userData.flap(ph, move ? 1 : 0);
    bird.position.y = move ? -Math.sin(ph) * 0.05 : 0;
    if (move) (e.userData.wheels || []).forEach((w) => { w.rotation.z -= dt * 6; });
    // 分解: 部品を離す(なめらかに)。分解したときは少し引いて全体が入るように
    explodeT += ((explodeOn ? 1 : 0) - explodeT) * Math.min(1, dt * 3.2);
    const k = explodeT * explodeT * (3 - 2 * explodeT);
    EX.forEach((x) => { if (x.off) x.obj.position.copy(x.home).addScaledVector(x.off, k); });
    const f = 1 + 0.35 * k;
    // 見ている先を、決まったまん中(goal)へなめらかに合わせる。羽ばたき・車輪の動きでは動かさない(画面が揺れないように)
    if (goal) { const d = goal.clone().sub(controls.target); if (d.length() < 1e-4) goal = null; else { d.multiplyScalar(Math.min(1, dt * 4)); controls.target.add(d); camera.position.add(d); } }
    if (Math.abs(lastF - f) > 1e-4) { const off = camera.position.clone().sub(controls.target); off.multiplyScalar(f / lastF); camera.position.copy(controls.target).add(off); lastF = f; }
    if (spin) { const a = dt * 0.18; const p = camera.position.clone().sub(controls.target); p.applyAxisAngle(V(0, 1, 0), a); camera.position.copy(controls.target).add(p); }
    controls.update();
    renderer.render(scene, camera);
    // 名札(分解したときだけ)
    const w = window.innerWidth, h = window.innerHeight, tmp = new THREE.Vector3(), bb = new THREE.Box3();
    EX.forEach((x) => {
      if (!x.el) return;
      const on = k > 0.6 && x.char.visible; x.el.classList.toggle("is-on", on); if (!on) return;
      if (x.bogie) { bb.makeEmpty(); x.obj.children.filter((c) => c.isGroup && c !== e.userData.shells[0]).forEach((c) => bb.expandByObject(c)); } else bb.setFromObject(x.obj);
      bb.getCenter(tmp); tmp.project(camera);
      const lx = Math.min((tmp.x * 0.5 + 0.5) * w - 4, w - x.el.offsetWidth - 8), ly = Math.min((-tmp.y * 0.5 + 0.5) * h - 4, h - 120);
      x.el.style.transform = `translate(${Math.max(8, lx)}px, ${ly}px)`;
    });
  }
  renderer.setAnimationLoop(render);
  window.BtexMascot = { setMode, explode: (v) => { explodeOn = !!v; explodeT = explodeOn ? 1 : 0; }, move: (v) => { move = !!v; }, spin: (v) => { spin = !!v; }, render, pose: (p) => { ph = p; } };
  </script>
</body>
</html>
