<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>BT-EX5 マスコット</title>
  <!-- BT-EX5 のマスコット(3D)。トキの「ときめ」と、新幹線の「つなぐ」。からくり人形のように、エナメルの板と金の縁・歯車でできている。
       指(マウス)で回せる・「分解して見る」で部品に分かれる・「画像で保存」で PNG にできる。
       URL の ? のあとで: c=toki / train / both(はじめに出すキャラ)、bg=dark / soft(背景)、explode=1(分解した形)、embed=1(ボタンなし) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@700;800&display=swap">
  <style>
    :root { --gold:#d9b46a; --ink:#f3ebe0; --sub:rgba(243,235,224,.66); --panel:rgba(20,18,18,.55); --line:rgba(217,180,106,.38);
      --mincho:"Shippori Mincho","Noto Serif CJK JP",serif; --sans:"Noto Sans JP","Noto Sans CJK JP",sans-serif; --en:"Cormorant Garamond",serif; }
    body.is-soft { --ink:#3a2a24; --sub:rgba(58,42,36,.7); --panel:rgba(255,255,255,.62); --line:rgba(180,110,90,.35); --gold:#b4774a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; background:#1c1b1d; }
    body { font-family:var(--sans); color:var(--ink); -webkit-tap-highlight-color:transparent; }
    body.is-soft { background:#f6e9e3; }
    canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
    .brand { position:fixed; left:clamp(16px,3vw,36px); top:clamp(14px,3vh,30px); pointer-events:none; }
    .brand p { font:600 italic clamp(13px,1.4vw,16px)/1 var(--en); letter-spacing:.32em; color:var(--gold); }
    .brand h1 { margin-top:8px; font:800 clamp(26px,3.4vw,44px)/1.15 var(--mincho); letter-spacing:.06em; }
    .brand h1 small { display:block; margin-top:6px; font:500 clamp(12px,1.2vw,14px)/1.6 var(--sans); letter-spacing:.08em; color:var(--sub); max-width:22em; }
    .labels { position:fixed; inset:0; pointer-events:none; }
    .lab { position:absolute; left:0; top:0; display:flex; align-items:center; gap:10px; opacity:0; transition:opacity .4s; white-space:nowrap; will-change:transform; }
    .lab.is-on { opacity:1; }
    .lab i { width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px rgba(217,180,106,.18); flex:none; }
    .lab span { padding:7px 12px 8px; border-left:1px solid var(--line); background:var(--panel); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:2px 8px 8px 2px; }
    .lab b { display:block; font:700 13px/1.2 var(--mincho); letter-spacing:.08em; }
    .lab b em { font:600 italic 12px/1 var(--en); color:var(--gold); margin-right:6px; font-style:italic; }
    .lab small { display:block; margin-top:3px; font:500 10.5px/1.3 var(--sans); letter-spacing:.1em; color:var(--sub); }
    .bar { position:fixed; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:8px; border-radius:999px; background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 0 0 1px var(--line); max-width:calc(100vw - 24px); }
    .bar button { appearance:none; border:0; border-radius:999px; padding:10px 16px; font:700 13px/1 var(--sans); letter-spacing:.06em; color:var(--ink); background:transparent; cursor:pointer; }
    .bar button[aria-pressed="true"] { background:linear-gradient(135deg,#e7c27a,#b98a3e); color:#1c1408; }
    .bar .sep { width:1px; background:var(--line); margin:4px 2px; }
    .hint { position:fixed; right:clamp(16px,3vw,36px); top:clamp(18px,3vh,34px); font:500 11px/1.6 var(--sans); letter-spacing:.12em; color:var(--sub); text-align:right; pointer-events:none; }
    body.is-embed .bar, body.is-embed .hint { display:none; }
    @media (max-width:640px) { .bar { border-radius:20px; width:calc(100vw - 24px); gap:4px; } .bar .sep { display:none; } .bar button { padding:9px 10px; font-size:12px; } .hint { display:none; } .lab small { display:none; } }
  </style>
  <script type="importmap">{ "imports": { "three": "../../assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="labels" id="labels"></div>
  <div class="brand"><p>BT-EX5 MASCOT</p><h1 id="name"></h1></div>
  <p class="hint">ドラッグで回す ・ ピンチ/ホイールで拡大</p>
  <nav class="bar" aria-label="操作">
    <button type="button" data-c="toki">トキ</button>
    <button type="button" data-c="train">新幹線</button>
    <button type="button" data-c="both">ふたり</button>
    <span class="sep"></span>
    <button type="button" id="explodeBtn" aria-pressed="false">分解して見る</button>
    <button type="button" id="spinBtn" aria-pressed="true">回す</button>
    <button type="button" id="bgBtn">背景</button>
    <button type="button" id="saveBtn">画像で保存</button>
  </nav>

  <script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "../../assets/vendor/three/OrbitControls.js";
  import { RoomEnvironment } from "../../assets/vendor/three/RoomEnvironment.js";

  const q = new URLSearchParams(location.search);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const TAU = Math.PI * 2;
  document.body.classList.toggle("is-embed", q.get("embed") === "1");

  // ---------- レンダラー・カメラ ----------
  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 3.5; controls.maxDistance = 16;
  controls.maxPolarAngle = Math.PI * 0.52;

  const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
  key.position.set(-4, 7, 5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
  key.shadow.radius = 6; key.shadow.bias = -0.0004;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xbcd2ff, 1.3); rim.position.set(5, 4, -6); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xfff6ee, 0x2a2420, 0.35));
  const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.ShadowMaterial({ opacity: 0.45 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // ---------- 背景 ----------
  function bgTexture(soft) {
    const c = document.createElement("canvas"); c.width = 1024; c.height = 1024;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(512, 420, 40, 512, 520, 760);
    if (soft) { gr.addColorStop(0, "#fff8f3"); gr.addColorStop(0.55, "#f8e4dc"); gr.addColorStop(1, "#e9cfc6"); }
    else { gr.addColorStop(0, "#3a383b"); gr.addColorStop(0.5, "#262527"); gr.addColorStop(1, "#151416"); }
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
  let soft = q.get("bg") === "soft";
  function applyBg() {
    scene.background = bgTexture(soft);
    floor.material.opacity = soft ? 0.2 : 0.45;
    document.body.classList.toggle("is-soft", soft);
  }
  applyBg();

  // ---------- 質感 ----------
  // 細かい粒の地(エナメルの下の打ち出し模様)
  function grainTexture() {
    const c = document.createElement("canvas"); c.width = c.height = 512;
    const g = c.getContext("2d"); g.fillStyle = "#808080"; g.fillRect(0, 0, 512, 512);
    const s = 12, hgt = s * Math.sqrt(3) / 2;
    for (let row = -1; row * hgt < 512 + s; row++) for (let col = -1; col * s < 512 + s; col++) {
      const x = col * s + (row % 2 ? s / 2 : 0), y = row * hgt;
      const gr = g.createRadialGradient(x, y, 0, x, y, s * 0.55);
      gr.addColorStop(0, "#d8d8d8"); gr.addColorStop(0.7, "#9a9a9a"); gr.addColorStop(1, "#5a5a5a");
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, s * 0.55, 0, TAU); g.fill();
    }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(7, 7); return t;
  }
  const GRAIN = grainTexture();
  const M = {
    gold: new THREE.MeshPhysicalMaterial({ color: 0xf2c467, metalness: 1, roughness: 0.22, clearcoat: 0.4, envMapIntensity: 1.5 }),
    brass: new THREE.MeshPhysicalMaterial({ color: 0xc89a4c, metalness: 1, roughness: 0.36, bumpMap: GRAIN, bumpScale: 0.3, envMapIntensity: 1.4 }),
    copper: new THREE.MeshPhysicalMaterial({ color: 0xd98a58, metalness: 0.55, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.4 }),
    lacquer: new THREE.MeshPhysicalMaterial({ color: 0x141416, metalness: 0.2, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.12 }),
    glass: new THREE.MeshPhysicalMaterial({ color: 0x0b0f18, metalness: 0.1, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02 }),
    eye: new THREE.MeshPhysicalMaterial({ color: 0x050505, metalness: 0, roughness: 0.03, clearcoat: 1 }),
    iris: new THREE.MeshPhysicalMaterial({ color: 0xf0a020, metalness: 0.3, roughness: 0.25, clearcoat: 1 }),
    lamp: new THREE.MeshPhysicalMaterial({ color: 0xfff6e0, emissive: 0xfff0c8, emissiveIntensity: 0.9, roughness: 0.1, clearcoat: 1 }),
    wood: new THREE.MeshPhysicalMaterial({ color: 0x4a2c1c, metalness: 0.1, roughness: 0.55, bumpMap: GRAIN, bumpScale: 0.4, clearcoat: 0.5 }),
  };
  const enamel = (color, extra) => new THREE.MeshPhysicalMaterial(Object.assign({ color, metalness: 0.05, roughness: 0.42, clearcoat: 1, clearcoatRoughness: 0.1, bumpMap: GRAIN, bumpScale: 0.45 }, extra || {}));
  const E = {
    white: enamel(0xf5efe8), pale: enamel(0xf7ddd2), toki: enamel(0xf1a58c), tokiDeep: enamel(0xe3866c), red: enamel(0xc9322a, { bumpScale: 0.7 }),
    legRed: enamel(0xc0392b), sky: enamel(0x5aa9dc), navy: enamel(0x22314f), ivory: enamel(0xf6f2ea),
  };

  // ---------- 形のどうぐ ----------
  function mesh(geo, mat, parent, cast = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; if (parent) parent.add(m); return m; }
  function ringAt(parent, center, normal, R, r, mat) {
    const m = mesh(new THREE.TorusGeometry(R, r, 12, 72), mat, parent);
    m.position.copy(center); m.quaternion.setFromUnitVectors(V(0, 0, 1), normal.clone().normalize()); return m;
  }
  // 平らな曲線(XY 面)にそって、太さが変わる筒
  function taperTube(curve, t0, t1, rFn, segs = 64, radial = 24) {
    const pos = [], nor = [], idx = [];
    const Z = V(0, 0, 1);
    for (let i = 0; i <= segs; i++) {
      const u = i / segs, t = t0 + (t1 - t0) * u;
      const P = curve.getPointAt(t), T = curve.getTangentAt(t);
      const N = new THREE.Vector3().crossVectors(Z, T).normalize(), B = Z;
      const r = rFn(u);
      for (let j = 0; j <= radial; j++) {
        const a = (j / radial) * TAU, n = N.clone().multiplyScalar(Math.cos(a)).addScaledVector(B, Math.sin(a));
        pos.push(P.x + n.x * r, P.y + n.y * r, P.z + n.z * r); nor.push(n.x, n.y, n.z);
      }
    }
    for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); g.setIndex(idx);
    return g;
  }
  // 羽の形(根元が x=0、先が x=len)
  function featherGeo(len, wid, depth = 0.014, round = 0.6) {
    const s = new THREE.Shape();
    s.moveTo(0, -wid * round); s.quadraticCurveTo(len * 0.55, -wid * 1.05, len, 0); s.quadraticCurveTo(len * 0.55, wid * 1.05, 0, wid * round); s.lineTo(0, -wid * round);
    return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, curveSegments: 18 });
  }
  // 金の縁どりつきの羽(金の板の上に、エナメルの板)
  function feather(parent, len, wid, mat) {
    // 表と裏の両方にエナメル、あいだに少し大きい金の板(どちらから見ても金の縁が見える)
    const g = new THREE.Group(); parent.add(g);
    const core = mesh(featherGeo(len * 1.04, wid * 1.14, 0.006), M.gold, g); core.position.set(-len * 0.02, 0, -0.003);
    mesh(featherGeo(len, wid, 0.008), mat, g).position.z = 0.006;
    mesh(featherGeo(len, wid, 0.008), mat, g).position.z = -0.02;
    return g;
  }
  // 歯車(スポークつき)
  function gearGeo(R, teeth, depth, spokes = 6) {
    const s = new THREE.Shape(), rr = R * 0.86, tooth = TAU / teeth;
    for (let i = 0; i < teeth; i++) {
      const a = i * tooth;
      const pts = [[rr, a], [R, a + tooth * 0.18], [R, a + tooth * 0.5], [rr, a + tooth * 0.68]];
      pts.forEach(([r, t], k) => { const x = Math.cos(t) * r, y = Math.sin(t) * r; if (i === 0 && k === 0) s.moveTo(x, y); else s.lineTo(x, y); });
    }
    s.closePath();
    const rim = R * 0.7, hub = R * 0.24, half = 0.18;
    for (let i = 0; i < spokes; i++) {
      const a0 = (i / spokes) * TAU + half / 1.2, a1 = ((i + 1) / spokes) * TAU - half / 1.2;
      const h = new THREE.Path();
      h.moveTo(Math.cos(a0) * hub * 1.25, Math.sin(a0) * hub * 1.25);
      h.absarc(0, 0, rim, a0 + 0.05, a1 - 0.05, false);
      h.lineTo(Math.cos(a1) * hub * 1.25, Math.sin(a1) * hub * 1.25);
      h.closePath(); s.holes.push(h);
    }
    return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: depth * 0.25, bevelSize: R * 0.015, bevelSegments: 2, curveSegments: 10 });
  }

  // ---------- 台座(文字盤) ----------
  function dialTexture(label) {
    const c = document.createElement("canvas"); c.width = c.height = 1024;
    const g = c.getContext("2d"), C = 512;
    const gr = g.createRadialGradient(C, C, 250, C, C, 512);
    gr.addColorStop(0, "#caa25a"); gr.addColorStop(0.6, "#e2c27e"); gr.addColorStop(1, "#b88c42");
    g.fillStyle = gr; g.beginPath(); g.arc(C, C, 512, 0, TAU); g.fill();
    g.strokeStyle = "rgba(60,40,10,.55)"; g.lineWidth = 2;
    [500, 470, 300, 285].forEach((r) => { g.beginPath(); g.arc(C, C, r, 0, TAU); g.stroke(); });
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * TAU, r0 = i % 5 ? 482 : 474;
      g.beginPath(); g.moveTo(C + Math.cos(a) * r0, C + Math.sin(a) * r0); g.lineTo(C + Math.cos(a) * 498, C + Math.sin(a) * 498); g.stroke();
    }
    const R = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
    g.fillStyle = "#3b2a10"; g.font = "600 54px 'Cormorant Garamond', 'Shippori Mincho', serif"; g.textAlign = "center"; g.textBaseline = "middle";
    R.forEach((t, i) => {
      const a = (i / 12) * TAU - Math.PI / 2;
      g.save(); g.translate(C + Math.cos(a) * 400, C + Math.sin(a) * 400); g.rotate(a + Math.PI / 2); g.fillText(t, 0, 0); g.restore();
    });
    // 内側の帯の文字
    g.font = "600 30px 'Cormorant Garamond', serif"; g.fillStyle = "#4a3514";
    const text = label + " · ", n = text.length * 3;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU - Math.PI / 2;
      g.save(); g.translate(C + Math.cos(a) * 316, C + Math.sin(a) * 316); g.rotate(a + Math.PI / 2); g.fillText(text[i % text.length], 0, 0); g.restore();
    }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  }
  function pedestal(label) {
    const g = new THREE.Group();
    mesh(new THREE.CylinderGeometry(1.52, 1.6, 0.16, 96), M.lacquer, g).position.y = 0.08;
    ringAt(g, V(0, 0.165, 0), V(0, 1, 0), 1.5, 0.012, M.gold);
    mesh(new THREE.CylinderGeometry(1.22, 1.22, 0.62, 96), M.lacquer, g).position.y = 0.47;
    [0.24, 0.32, 0.7].forEach((y) => ringAt(g, V(0, y, 0), V(0, 1, 0), 1.225, 0.009, M.gold));
    mesh(new THREE.CylinderGeometry(1.36, 1.3, 0.14, 96), M.lacquer, g).position.y = 0.85;
    ringAt(g, V(0, 0.92, 0), V(0, 1, 0), 1.355, 0.016, M.gold);
    const face = mesh(new THREE.RingGeometry(0.5, 1.24, 128), new THREE.MeshPhysicalMaterial({ map: dialTexture(label), metalness: 0.85, roughness: 0.32, clearcoat: 0.6 }), g, false);
    face.rotation.x = -Math.PI / 2; face.rotation.z = Math.PI / 2; face.position.y = 0.921;
    const inner = mesh(new THREE.CircleGeometry(0.5, 64), M.lacquer, g, false); inner.rotation.x = -Math.PI / 2; inner.position.y = 0.92;
    ringAt(g, V(0, 0.925, 0), V(0, 1, 0), 0.5, 0.012, M.gold);
    // ぜんまいの鍵
    const keyG = new THREE.Group(); g.add(keyG);
    mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.16, 12), M.gold, keyG).rotation.x = Math.PI / 2;
    [-0.045, 0.045].forEach((x) => { const lp = mesh(new THREE.TorusGeometry(0.04, 0.011, 10, 24), M.gold, keyG); lp.position.set(x, 0, 0.1); });
    keyG.position.set(Math.cos(-0.5) * 1.22, 0.47, Math.sin(-0.5) * -1.22); keyG.lookAt(keyG.position.clone().multiplyScalar(2).setY(0.47));
    // 歯車
    const gear = mesh(gearGeo(0.36, 28, 0.05), M.gold, g); gear.rotation.x = -Math.PI / 2; gear.position.set(-0.32, 0.93, 0.42);
    const cap = mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.06, 24), M.brass, g); cap.position.set(-0.32, 0.99, 0.42);
    const gear2 = mesh(gearGeo(0.16, 14, 0.04, 5), M.brass, g); gear2.rotation.x = -Math.PI / 2; gear2.position.set(0.15, 0.93, 0.6);
    g.userData.gears = [gear, gear2];
    return g;
  }

  // ---------- トキ「ときめ」 ----------
  function buildToki() {
    const root = new THREE.Group();
    const parts = {};
    const part = (name) => { const p = new THREE.Group(); root.add(p); parts[name] = p; return p; };
    const ped = part("pedestal"); ped.add(pedestal("BT-EX5 · NIIGATA ⇔ TOKYO"));
    // 枝(真ちゅう)
    const branchCurve = new THREE.CatmullRomCurve3([V(0.25, 0.92, 0.05), V(0.32, 1.35, 0.02), V(0.2, 1.75, 0), V(-0.05, 2.0, 0)]);
    mesh(new THREE.TubeGeometry(branchCurve, 48, 0.07, 16), M.wood, ped);
    mesh(new THREE.SphereGeometry(0.085, 20, 16), M.gold, ped).position.copy(branchCurve.getPoint(1));
    ringAt(ped, branchCurve.getPoint(0.04), V(0.1, 1, 0), 0.085, 0.018, M.gold);

    const bird = new THREE.Group(); bird.position.set(-0.05, 2.12, 0); root.add(bird);
    // 胴(卵形)
    const body = part("body"); bird.add(body);
    const torso = new THREE.Group(); torso.scale.set(1.28, 0.92, 0.86); torso.rotation.z = 0.32; torso.position.set(0, 0.42, 0); body.add(torso);
    mesh(new THREE.SphereGeometry(0.5, 64, 48), E.white, torso);
    // 胴の継ぎ目(金)
    const seam = mesh(new THREE.TorusGeometry(0.5, 0.012, 10, 96), M.gold, torso); seam.rotation.y = Math.PI / 2;
    // 首の金の輪
    ringAt(body, V(0.42, 0.78, 0), V(0.6, 0.8, 0), 0.2, 0.022, M.gold);
    // のぞき窓と歯車
    const port = new THREE.Group(); port.position.set(-0.08, 0.36, 0.44); body.add(port);
    ringAt(port, V(0, 0, 0), V(0, 0, 1), 0.085, 0.016, M.gold);
    mesh(new THREE.CircleGeometry(0.08, 32), M.lacquer, port, false).position.z = -0.005;
    const pg = mesh(gearGeo(0.065, 12, 0.012, 5), M.gold, port); pg.position.z = -0.002;
    body.userData.spin = pg;
    // 中の歯車(分解すると見える)
    const inGear = mesh(gearGeo(0.22, 18, 0.04), M.brass, body); inGear.position.set(0.1, 0.5, -0.02);

    // 胸当て(淡紅)
    const breast = part("breast"); bird.add(breast);
    const bt = new THREE.Group(); bt.scale.copy(torso.scale); bt.rotation.copy(torso.rotation); bt.position.copy(torso.position); breast.add(bt);
    const capAxis = new THREE.Group(); capAxis.quaternion.setFromUnitVectors(V(0, 1, 0), V(0.75, -0.66, 0).normalize()); bt.add(capAxis);
    mesh(new THREE.SphereGeometry(0.508, 48, 24, 0, TAU, 0, 0.95), E.pale, capAxis);
    const cr = mesh(new THREE.TorusGeometry(0.508 * Math.sin(0.95), 0.014, 10, 96), M.gold, capAxis); cr.rotation.x = Math.PI / 2; cr.position.y = 0.508 * Math.cos(0.95);

    // 頭
    const head = part("head"); head.position.set(0.55, 0.98, 0); bird.add(head);
    mesh(new THREE.SphereGeometry(0.3, 64, 48), E.white, head);
    // 朱の顔(くちばしの根元から目のまわり)
    // 目のまわりの朱(左右)と、くちばしの根元の朱。金の縁どり
    [1, -1].forEach((side) => {
      const ax = V(0.5, 0.12, 0.86 * side).normalize(), cap = new THREE.Group(); cap.quaternion.setFromUnitVectors(V(0, 1, 0), ax); head.add(cap);
      mesh(new THREE.SphereGeometry(0.303, 40, 16, 0, TAU, 0, 0.42), E.red, cap);
      const rr = mesh(new THREE.TorusGeometry(0.303 * Math.sin(0.42), 0.007, 8, 64), M.gold, cap); rr.rotation.x = Math.PI / 2; rr.position.y = 0.303 * Math.cos(0.42);
    });
    { const cap = new THREE.Group(); cap.quaternion.setFromUnitVectors(V(0, 1, 0), V(1, -0.05, 0).normalize()); head.add(cap);
      mesh(new THREE.SphereGeometry(0.302, 40, 16, 0, TAU, 0, 0.4), E.red, cap); }
    // 頭のうろこ(白から鴇色へ)
    const scaleGeo = new THREE.CylinderGeometry(0.052, 0.052, 0.012, 20);
    for (let row = 0; row < 6; row++) {
      const th = 0.25 + row * 0.2, n = 6 + row * 2;
      for (let k = 0; k < n; k++) {
        const ph = Math.PI * 0.15 + (k / (n - 1)) * Math.PI * 1.1 - 0.9 + Math.PI * 0.5;
        const p = V(-Math.cos(ph) * Math.sin(th), Math.cos(th), Math.sin(ph) * Math.sin(th));
        if (p.x > 0.35 && p.y < 0.75) continue; // 顔の朱の上には置かない
        const mat = row < 2 ? E.white : row < 4 ? E.pale : E.toki;
        const s = mesh(scaleGeo, mat, head); s.position.copy(p.clone().multiplyScalar(0.305));
        s.quaternion.setFromUnitVectors(V(0, 1, 0), p.clone().normalize());
        s.rotateX(-0.25);
      }
    }
    // 目(黒いガラス・山吹の虹彩・金の縁)
    [1, -1].forEach((side) => {
      const c = V(0.15, 0.05, 0.255 * side), n = V(0.35, 0.1, side).normalize();
      const e = mesh(new THREE.SphereGeometry(0.05, 32, 24), M.eye, head); e.position.copy(c);
      ringAt(head, c.clone().addScaledVector(n, -0.004), n, 0.058, 0.011, M.iris);
      ringAt(head, c.clone().addScaledVector(n, -0.012), n, 0.074, 0.011, M.gold);
      const hl = mesh(new THREE.SphereGeometry(0.012, 12, 8), M.lamp, head, false); hl.position.copy(c.clone().addScaledVector(n, 0.045).add(V(0.012, 0.018, 0)));
    });
    // くちばし(黒漆、先は朱)
    const beak = part("beak"); head.add(beak);
    const bc = new THREE.CatmullRomCurve3([V(0.24, -0.02, 0), V(0.55, -0.06, 0), V(0.86, -0.2, 0), V(1.06, -0.42, 0)]);
    mesh(taperTube(bc, 0, 0.86, (u) => 0.072 - 0.05 * u), M.lacquer, beak);
    mesh(taperTube(bc, 0.86, 1, (u) => 0.025 * Math.sqrt(Math.max(0, 1 - u * u)) + 0.001), E.red, beak);
    ringAt(beak, bc.getPointAt(0.02), bc.getTangentAt(0.02), 0.074, 0.016, M.gold);
    // 冠羽(後ろ頭のふさふさ)
    const crest = part("crest"); head.add(crest);
    for (let i = 0; i < 9; i++) {
      const f = feather(crest, 0.5 + (i % 3) * 0.08, 0.075, i % 3 === 0 ? E.white : i % 3 === 1 ? E.pale : E.toki);
      const a = -0.35 - (i % 3) * 0.28 - Math.floor(i / 3) * 0.04;
      f.position.set(-0.22, 0.2 - (i % 3) * 0.07, (Math.floor(i / 3) - 1) * 0.08);
      f.rotation.set(0, Math.PI + (Math.floor(i / 3) - 1) * 0.28, a);
    }

    // 翼(左右)
    [1, -1].forEach((side) => {
      const wing = part(side > 0 ? "wingR" : "wingL"); bird.add(wing);
      wing.position.set(0.3, 0.66, 0.34 * side);
      wing.rotation.set(side * -0.18, side * 0.12, 0.36);
      if (side < 0) wing.scale.z = -1;
      const rows = [
        { n: 5, len: 0.28, wid: 0.09, mat: E.white, y: 0.06, x0: -0.02, dx: -0.1 },
        { n: 6, len: 0.44, wid: 0.085, mat: E.pale, y: -0.03, x0: -0.06, dx: -0.09 },
        { n: 6, len: 0.62, wid: 0.08, mat: E.toki, y: -0.11, x0: -0.12, dx: -0.08 },
        { n: 5, len: 0.8, wid: 0.075, mat: E.tokiDeep, y: -0.17, x0: -0.36, dx: -0.07 },
      ];
      rows.forEach((r, ri) => {
        for (let k = 0; k < r.n; k++) {
          const f = feather(wing, r.len, r.wid, r.mat);
          f.position.set(r.x0 + k * r.dx, r.y - k * 0.012, 0.02 * (rows.length - ri) + k * 0.004);
          f.rotation.set(0, 0, Math.PI - 0.08 - k * 0.025);
        }
      });
      // 翼の上の小さなのぞき窓
      const wp = new THREE.Group(); wp.position.set(-0.22, 0.02, 0.11); wing.add(wp);
      ringAt(wp, V(0, 0, 0), V(0, 0, 1), 0.05, 0.011, M.gold);
      const wg = mesh(gearGeo(0.04, 10, 0.01, 4), M.brass, wp); wg.position.z = -0.004;
    });

    // 尾羽
    const tail = part("tail"); tail.position.set(-0.62, 0.22, 0); bird.add(tail);
    for (let i = 0; i < 7; i++) {
      const f = feather(tail, 0.55 + (3 - Math.abs(i - 3)) * 0.05, 0.06, i % 2 ? E.toki : E.pale);
      f.rotation.set(0, (i - 3) * 0.12, Math.PI + 0.5);
      f.position.set(0, -0.01 * Math.abs(i - 3), (i - 3) * 0.03);
    }
    const hinge = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.3, 16), M.gold, tail); hinge.rotation.x = Math.PI / 2;

    // 脚(朱)と金の関節
    const legs = part("legs"); bird.add(legs);
    [0.09, -0.09].forEach((z) => {
      const top = V(0.02, 0.08, z), bot = V(-0.02, -0.1, z);
      const seg = mesh(new THREE.CylinderGeometry(0.03, 0.026, top.distanceTo(bot), 12), E.legRed, legs);
      seg.position.copy(top.clone().add(bot).multiplyScalar(0.5)); seg.quaternion.setFromUnitVectors(V(0, 1, 0), top.clone().sub(bot).normalize());
      mesh(new THREE.SphereGeometry(0.04, 16, 12), M.gold, legs).position.copy(top);
      mesh(new THREE.SphereGeometry(0.034, 16, 12), M.gold, legs).position.copy(bot);
      [-0.5, 0, 0.5].forEach((a) => {
        const toe = mesh(new THREE.CylinderGeometry(0.016, 0.01, 0.13, 8), E.legRed, legs);
        toe.position.copy(bot).add(V(Math.cos(a) * 0.05, -0.02, Math.sin(a) * 0.05));
        toe.rotation.set(Math.sin(a) * 0.9, 0, Math.PI / 2 + 0.5);
      });
    });

    root.userData = {
      parts, name: "ときめ", sub: "新潟の鳥・トキのからくり人形。鴇色(ときいろ)の羽板と、朱のエナメルの顔。上越新幹線の「とき」と同じ名前の鳥です。",
      explode: {
        head: { off: V(0.45, 0.55, 0), origin: true, label: ["01", "頭部", "HEAD — 朱のエナメル面・山吹の瞳"] },
        beak: { off: V(0.35, 0.05, 0) },
        crest: { off: V(-0.85, -0.12, 0), label: ["02", "冠羽", "CREST — 白から鴇色の羽板"] },
        wingR: { off: V(-0.05, 0.25, 0.75), label: ["03", "翼", "WING — 鴇色の羽板・金の縁"] },
        wingL: { off: V(-0.05, 0.25, -0.75) },
        breast: { off: V(0.55, -0.25, 0), label: ["04", "胸当て", "BREAST — 淡紅のエナメル"] },
        tail: { off: V(-0.6, -0.1, 0), label: ["05", "尾羽", "TAIL — 羽板と蝶番"] },
        legs: { off: V(0, -0.22, 0) },
        body: { off: V(0, 0, 0), label: ["06", "胴", "BODY — 打ち出しの白エナメル・歯車"] },
        pedestal: { off: V(0, -0.35, 0), label: ["07", "台座", "PEDESTAL — 新潟⇔東京の文字盤"] },
      },
      gears: ped.children[0].userData.gears, spin: [body.userData.spin], idle: (t) => { head.rotation.z = Math.sin(t * 0.9) * 0.05; head.rotation.y = Math.sin(t * 0.5) * 0.08; },
    };
    return root;
  }

  // ---------- 新幹線「つなぐ」 ----------
  function buildTrain() {
    const root = new THREE.Group();
    const parts = {};
    const part = (name, parent = root) => { const p = new THREE.Group(); parent.add(p); parts[name] = p; return p; };
    const ped = part("pedestal"); ped.add(pedestal("SHINKANSEN · TSUNAGU · BT-EX5"));
    // 線路(金のレールと枕木)
    [-0.24, 0.24].forEach((z) => { const r = mesh(new THREE.BoxGeometry(2.7, 0.04, 0.04), M.gold, ped); r.position.set(0, 0.98, z); });
    for (let i = 0; i < 11; i++) { const s = mesh(new THREE.BoxGeometry(0.12, 0.035, 0.66), M.wood, ped); s.position.set(-1.25 + i * 0.25, 0.945, 0); }

    const L = 2.6, Ln = 1.3, W = 0.42, H = 0.42, C = 0.26;
    function sec(s) {
      let w = W, h = H, yc = H, n = 3.4;
      if (s < C) { const k = Math.sqrt(Math.max(0, 1 - Math.pow(1 - s / C, 2))); w = W * Math.max(k, 0.001); h = H * Math.max(k, 0.001); yc = H; }
      if (s > L - Ln) {
        const u = (s - (L - Ln)) / Ln;
        w = W * (1 - 0.8 * Math.pow(u, 1.5)); h = H * (1 - 0.86 * Math.pow(u, 1.05)); yc = h; n = 3.4 - 1.0 * u;
        if (u > 0.95) { const k = Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.95) / 0.05, 2))); w *= Math.max(k, 0.001); h *= Math.max(k, 0.001); yc = H * (1 - 0.86) ; }
      }
      return { w, h, yc, n };
    }
    const P = (s, th) => {
      const { w, h, yc, n } = sec(s), c = Math.cos(th), si = Math.sin(th);
      return V(s - L / 2, yc + h * Math.sign(si) * Math.pow(Math.abs(si), 2 / n), w * Math.sign(c) * Math.pow(Math.abs(c), 2 / n));
    };
    function loft(s0, s1, t0, t1, ns = 60, nt = 24) {
      const pos = [], nor = [], idx = [], e = 1e-3;
      for (let i = 0; i <= ns; i++) {
        const s = s0 + (s1 - s0) * (i / ns);
        for (let j = 0; j <= nt; j++) {
          const th = t0 + (t1 - t0) * (j / nt), p = P(s, th);
          const ds = P(Math.min(L, s + e), th).sub(P(Math.max(0, s - e), th));
          const dt = P(s, th + e).sub(P(s, th - e));
          let nrm = new THREE.Vector3().crossVectors(ds, dt);
          if (nrm.lengthSq() < 1e-12) nrm.set(s < L / 2 ? -1 : 1, 0, 0);
          nrm.normalize();
          pos.push(p.x, p.y, p.z); nor.push(nrm.x, nrm.y, nrm.z);
        }
      }
      for (let i = 0; i < ns; i++) for (let j = 0; j < nt; j++) {
        const a = i * (nt + 1) + j, b = a + nt + 1;
        idx.push(a, b, a + 1, b, b + 1, a + 1);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); g.setIndex(idx);
      return g;
    }
    const S1 = L - Ln;
    // 帯: 下は空色・銅のライン・白・窓・屋根
    const bands = [
      [Math.PI + 0.1, TAU - 0.1, E.sky], [-0.1, 0, M.copper], [Math.PI, Math.PI + 0.1, M.copper],
      [0, 0.4, E.ivory], [Math.PI - 0.4, Math.PI, E.ivory], [0.4, 0.68, M.glass], [Math.PI - 0.68, Math.PI - 0.4, M.glass],
    ];
    const train = new THREE.Group(); train.position.y = 1.12; root.add(train);
    const body = part("body", train), nose = part("nose", train), roof = part("roof", train);
    bands.forEach(([a, b, m]) => { mesh(loft(0, S1, a, b, 40, 18), m, body).material.side = THREE.DoubleSide; mesh(loft(S1, L, a, b, 60, 18), m, nose).material.side = THREE.DoubleSide; });
    mesh(loft(0, S1, 0.68, Math.PI - 0.68, 40, 24), E.ivory, roof).material.side = THREE.DoubleSide;
    // 先頭の屋根: 運転席の窓(黒いガラス)
    const uA = S1 + Ln * 0.08, uB = S1 + Ln * 0.42;
    mesh(loft(S1, uA, 0.68, Math.PI - 0.68, 10, 24), E.ivory, nose);
    mesh(loft(uA, uB, 0.68, Math.PI - 0.68, 24, 24), M.glass, nose);
    mesh(loft(uB, L, 0.68, Math.PI - 0.68, 40, 24), E.ivory, nose);
    // 金の細い線(窓のふち)
    const pipe = (parent, th, s0, s1) => {
      const pts = []; for (let i = 0; i <= 40; i++) { const s = s0 + (s1 - s0) * (i / 40); const p = P(s, th); pts.push(p.add(V(0, 0, 0).copy(p).setX(0).setY(0).multiplyScalar(0.012))); }
      mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.008, 8), M.gold, parent);
    };
    [0.4, 0.68, Math.PI - 0.68, Math.PI - 0.4].forEach((th) => { pipe(body, th, 0.12, S1); pipe(nose, th, S1, S1 + Ln * 0.9); });
    // 前照灯(目)
    [1, -1].forEach((side) => {
      const s = S1 + Ln * 0.6, p = P(s, side > 0 ? 0.12 : Math.PI - 0.12);
      const nrm = V(0.55, 0.15, side).normalize();
      const lamp = mesh(new THREE.SphereGeometry(0.045, 24, 16), M.lamp, nose); lamp.position.copy(p).addScaledVector(nrm, -0.01);
      ringAt(nose, p.clone().addScaledVector(nrm, 0.005), nrm, 0.055, 0.01, M.gold);
    });
    // パンタグラフ
    const panto = new THREE.Group(); panto.position.set(-0.55, 2 * H + 0.01, 0); panto.scale.setScalar(0.7); roof.add(panto);
    mesh(new THREE.BoxGeometry(0.3, 0.04, 0.22), M.gold, panto).position.y = 0.02;
    const arm1 = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 8), M.gold, panto); arm1.position.set(0.05, 0.14, 0); arm1.rotation.z = -0.9;
    const arm2 = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.28, 8), M.gold, panto); arm2.position.set(0.06, 0.32, 0); arm2.rotation.z = 0.9;
    const bar = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.36, 8), M.gold, panto); bar.position.set(-0.04, 0.42, 0); bar.rotation.x = Math.PI / 2;
    // 中の歯車(分解すると見える)
    const g1 = mesh(gearGeo(0.24, 20, 0.05), M.brass, body); g1.position.set(-0.4, H, 0);
    const g2 = mesh(gearGeo(0.15, 14, 0.05, 5), M.gold, body); g2.position.set(-0.05, H + 0.1, 0.02);
    // 台車(歯車の車輪)
    const bogie = part("bogie", train);
    const wheels = [];
    [-0.75, 0.55].forEach((x) => {
      const frame = mesh(new THREE.BoxGeometry(0.62, 0.08, 0.5), M.lacquer, bogie); frame.position.set(x, 0.02, 0);
      [-0.16, 0.16].forEach((dx) => [-0.26, 0.26].forEach((z) => {
        const wg = mesh(gearGeo(0.13, 16, 0.035, 5), M.gold, bogie); wg.position.set(x + dx, -0.03, z - (z > 0 ? 0 : 0.035)); wheels.push(wg);
      }));
    });
    root.userData = {
      parts, name: "つなぐ", sub: "新潟と東京をつなぐ、上越新幹線をイメージしたからくりの新幹線。白と空色のエナメルに銅のライン、歯車の車輪で走ります。",
      explode: {
        nose: { off: V(0.75, 0.15, 0), label: ["01", "先頭ノーズ", "NOSE — 運転席の窓・前照灯"] },
        roof: { off: V(0, 0.6, 0), label: ["02", "屋根", "ROOF — 金のパンタグラフ"] },
        body: { off: V(-0.15, 0.1, 0), label: ["03", "車体", "BODY — 白・空色のエナメルと銅のライン"] },
        bogie: { off: V(0, -0.28, 0), label: ["04", "台車", "BOGIE — 歯車の車輪"] },
        pedestal: { off: V(0, -0.45, 0), label: ["05", "台座", "PEDESTAL — 線路と文字盤"] },
      },
      gears: ped.children[0].userData.gears, spin: [g1, g2], wheels,
      idle: (t) => { train.position.y = 1.12 + Math.sin(t * 2.2) * 0.008; },
    };
    return root;
  }

  // ---------- 場面 ----------
  const toki = buildToki(), train = buildTrain();
  scene.add(toki, train);
  const chars = { toki, train };
  // 分解のときの部品の元の位置
  Object.values(chars).forEach((c) => Object.entries(c.userData.parts).forEach(([k, p]) => { p.userData.home = p.position.clone(); }));

  // 名札
  const labelBox = document.getElementById("labels");
  const labels = [];
  Object.values(chars).forEach((c) => Object.entries(c.userData.explode).forEach(([k, ex]) => {
    if (!ex.label) return;
    const el = document.createElement("div"); el.className = "lab";
    el.innerHTML = `<i></i><span><b><em>${ex.label[0]}</em>${ex.label[1]}</b><small>${ex.label[2]}</small></span>`;
    labelBox.appendChild(el);
    labels.push({ el, char: c, part: c.userData.parts[k], origin: !!ex.origin });
  }));

  let mode = ["toki", "train", "both"].includes(q.get("c")) ? q.get("c") : "toki";
  let t = 0, lastF = 1;
  let explodeOn = q.get("explode") === "1", explodeT = explodeOn ? 1 : 0, spin = q.get("spin") !== "0";
  const VIEWS = {
    toki: { target: V(0, 1.55, 0), pos: V(3.6, 2.9, 6.2) },
    train: { target: V(0, 1.2, 0), pos: V(3.8, 2.7, 6.0) },
    both: { target: V(0, 1.45, 0), pos: V(4.6, 3.6, 9.4) },
  };
  function setMode(m) {
    mode = m;
    toki.visible = m !== "train"; train.visible = m !== "toki";
    toki.position.set(m === "both" ? -1.75 : 0, 0, m === "both" ? 0.1 : 0);
    train.position.set(m === "both" ? 1.75 : 0, 0, m === "both" ? -0.1 : 0);
    train.rotation.y = m === "both" ? -0.5 : -0.35;
    toki.rotation.y = m === "both" ? 0.15 : -0.3;
    const v = VIEWS[m]; controls.target.copy(v.target); camera.position.copy(v.pos); lastF = 1;
    document.querySelectorAll("[data-c]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === m)));
    const name = document.getElementById("name");
    if (m === "both") name.innerHTML = `ときめ と つなぐ<small>新潟の鳥・トキと、新潟と東京をつなぐ新幹線。BT-EX5 の、からくり仕掛けのマスコットです。</small>`;
    else { const u = chars[m].userData; name.innerHTML = `${u.name}<small>${u.sub}</small>`; }
  }
  setMode(mode);
  document.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.c)));
  const explodeBtn = document.getElementById("explodeBtn"), spinBtn = document.getElementById("spinBtn");
  explodeBtn.setAttribute("aria-pressed", String(explodeOn));
  spinBtn.setAttribute("aria-pressed", String(spin));
  explodeBtn.addEventListener("click", () => { explodeOn = !explodeOn; explodeBtn.setAttribute("aria-pressed", String(explodeOn)); });
  spinBtn.addEventListener("click", () => { spin = !spin; spinBtn.setAttribute("aria-pressed", String(spin)); });
  document.getElementById("bgBtn").addEventListener("click", () => { soft = !soft; applyBg(); });
  document.getElementById("saveBtn").addEventListener("click", () => {
    render(); const a = document.createElement("a");
    a.href = renderer.domElement.toDataURL("image/png"); a.download = `bt-ex5-mascot-${mode}${explodeOn ? "-parts" : ""}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < h ? 44 : 32; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  const ease = (t) => t * t * (3 - 2 * t);
  const tmp = new THREE.Vector3();
  const clock = new THREE.Clock();
  function render() {
    const dt = Math.min(clock.getDelta(), 0.05); t += dt;
    explodeT += ((explodeOn ? 1 : 0) - explodeT) * Math.min(1, dt * 3.2);
    const k = ease(Math.max(0, Math.min(1, explodeT)));
    Object.values(chars).forEach((c) => {
      const u = c.userData;
      Object.entries(u.explode).forEach(([name, ex]) => { const p = u.parts[name]; p.position.copy(p.userData.home).addScaledVector(ex.off, k); });
      (u.gears || []).forEach((g, i) => { g.rotation.z += dt * (i ? -0.9 : 0.45); });
      (u.spin || []).forEach((g, i) => { g.rotation.z += dt * (i % 2 ? -1.2 : 0.8); });
      (u.wheels || []).forEach((g) => { g.rotation.z -= dt * 1.6; });
      if (u.idle) u.idle(t);
    });
    // 分解したときは、少し引いて全体が入るように
    const f = 1 + 0.32 * k, base = VIEWS[mode].target;
    controls.target.set(base.x, base.y + 0.32 * k, base.z);
    if (lastF !== f) { const off = camera.position.clone().sub(controls.target); off.multiplyScalar(f / lastF); camera.position.copy(controls.target).add(off); lastF = f; }
    if (spin) { const a = dt * 0.18; const p = camera.position.clone().sub(controls.target); p.applyAxisAngle(V(0, 1, 0), a); camera.position.copy(controls.target).add(p); }
    controls.update();
    renderer.render(scene, camera);
    // 名札(分解したときだけ)
    const w = window.innerWidth, h = window.innerHeight;
    labels.forEach((L) => {
      const on = k > 0.6 && L.char.visible;
      L.el.classList.toggle("is-on", on);
      if (!on) return;
      if (L.origin) L.part.getWorldPosition(tmp); else new THREE.Box3().setFromObject(L.part).getCenter(tmp);
      tmp.project(camera);
      L.el.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * w - 4}px, ${(-tmp.y * 0.5 + 0.5) * h - 4}px)`;
    });
  }
  renderer.setAnimationLoop(render);
  window.BtexMascot = { setMode, explode: (v) => { explodeOn = !!v; explodeT = explodeOn ? 1 : 0; }, spin: (v) => { spin = !!v; }, render };
  </script>
</body>
</html>
