<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>BT-EX5 ポスター(A4横)</title>
  <!-- BT-EX5 のポスター(A4 横・印刷用)。BT-EX フェス・定例会のどちらも、回・日時・会場・参加費を変えるだけで作れる。
       アプリの「資料」から開く。URL の ? のあとで中身を渡す:
         k=fes(BT-EX フェス)/ regular(定例会)、no=回(数字)、date=YYYY-MM-DD、start・end・open(受付)=HH:MM、place=会場、fee=参加費
         print=1 で開くと印刷(PDF で保存)の画面を出す / png=1 で画像(PNG)を保存する / embed=1 はアプリの中の見本用 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Noto+Sans+JP:wght@500;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap">
  <style>
    @page { size: 297mm 210mm; margin: 0; }
    :root {
      --coral: #d9776b; --coral-deep: #b4554a; --coral-soft: #fbe9e5; --blush: #faf5f2;
      --ink: #3a2c26; --sub: #75645b; --sage: #8fae96; --line: rgba(196, 98, 90, 0.22);
      --script: "Great Vibes", cursive; --mincho: "Shippori Mincho", "Noto Serif CJK JP", serif;
      --num: "Cormorant Garamond", "Shippori Mincho", serif; --sans: "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 数字は高さのそろった形(12/2・14:30 が上下にずれて見えないように) */
    .date, .time b, .card-value .num { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
    html, body { background: #e9e2de; }
    body { font-family: var(--sans); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* 画面では、ポスター(297mm×210mm)を画面の幅に合わせて縮めて見せる(印刷・画像にするときは原寸) */
    .stage { width: 297mm; height: 210mm; transform-origin: 0 0; margin: 0 auto; }
    .stage-wrap { padding: 16px; display: flex; justify-content: center; overflow: hidden; }
    body.is-embed { background: transparent; }
    body.is-embed .stage-wrap { padding: 0; justify-content: flex-start; }
    body.is-embed .poster { box-shadow: none; }
    @media print { html, body { background: none; } .stage-wrap { padding: 0; display: block; } .stage { transform: none !important; margin: 0; } .poster { box-shadow: none !important; } .stage-wrap { height: auto !important; } }

    .poster {
      position: relative; width: 297mm; height: 210mm; overflow: hidden; background: var(--blush);
      box-shadow: 0 20px 60px rgba(80, 50, 40, 0.18);
    }
    /* 淡い水彩のにじみ */
    .wash { position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(60mm 46mm at 96% 4%, rgba(240, 186, 174, 0.55), rgba(240, 186, 174, 0) 70%),
        radial-gradient(70mm 52mm at 52% 100%, rgba(244, 205, 196, 0.42), rgba(244, 205, 196, 0) 70%),
        radial-gradient(64mm 50mm at 0% 96%, rgba(178, 208, 186, 0.5), rgba(178, 208, 186, 0) 70%),
        radial-gradient(50mm 40mm at 36% 0%, rgba(250, 226, 214, 0.7), rgba(250, 226, 214, 0) 70%); }
    /* 葉の線画 */
    .leaf { position: absolute; pointer-events: none; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .leaf.is-tl { left: -8mm; top: -6mm; width: 62mm; stroke: #e2a497; stroke-width: 1.1; opacity: 0.7; }
    .leaf.is-bl { left: -6mm; bottom: -10mm; width: 56mm; stroke: #93b59b; stroke-width: 1.1; opacity: 0.75; }
    .leaf.is-r { right: -4mm; bottom: 26mm; width: 34mm; stroke: #e2a497; stroke-width: 1; opacity: 0.55; }
    /* 散らした小さな点 */
    .dots { position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(217, 119, 107, 0.45) 0.45mm, transparent 0.55mm), radial-gradient(circle, rgba(143, 174, 150, 0.45) 0.4mm, transparent 0.5mm);
      background-size: 41mm 37mm, 53mm 47mm; background-position: 7mm 9mm, 29mm 21mm; opacity: 0.5;
      -webkit-mask: linear-gradient(90deg, #000 0 8%, transparent 30% 70%, #000 92%); mask: linear-gradient(90deg, #000 0 8%, transparent 30% 70%, #000 92%); }

    /* ---------- 左: 題・日時・会場 ---------- */
    .main { position: absolute; left: 20mm; top: 13mm; width: 158mm; }
    .brand { display: flex; align-items: center; gap: 2.6mm; }
    .brand img { width: 9.5mm; height: 9.5mm; border-radius: 2.2mm; }
    .brand b { font-family: "Inter", var(--sans); font-size: 4.4mm; font-weight: 900; letter-spacing: 0.06em; }
    .brand b em { font-style: normal; color: var(--coral-deep); }
    .brand span { font-size: 2.6mm; font-weight: 700; letter-spacing: 0.24em; color: var(--sub); }

    .kicker { margin-top: 9mm; display: flex; align-items: center; gap: 3mm; font-family: var(--mincho); font-size: 5.2mm; font-weight: 700; letter-spacing: 0.5em; color: var(--coral-deep); }
    .kicker::before, .kicker::after { content: ""; width: 12mm; height: 0.35mm; background: linear-gradient(90deg, rgba(217, 119, 107, 0), var(--coral)); }
    .kicker::after { transform: scaleX(-1); }

    .title { position: relative; margin-top: 1mm; line-height: 1; }
    .title-en { display: block; font-family: var(--num); font-size: 44mm; font-weight: 700; letter-spacing: -0.01em; line-height: 0.9; color: #33251f; }
    .title-ja { display: inline-block; margin-top: 1mm; font-family: var(--mincho); font-size: 19mm; font-weight: 800; letter-spacing: 0.08em; color: var(--ink); }
    .title-fes { position: absolute; left: 76mm; top: 41mm; font-family: var(--script); font-size: 27mm; line-height: 1; color: var(--coral); transform: rotate(-6deg); text-shadow: 0 0.6mm 0 rgba(255, 255, 255, 0.8); }
    .catch { margin-top: 5mm; font-family: var(--mincho); font-size: 6.2mm; font-weight: 700; letter-spacing: 0.34em; color: var(--ink); }
    .catch { display: inline-block; vertical-align: top; max-width: 150mm; }
    .catch::after { content: ""; display: block; width: calc(100% - 0.3em); height: 0.5mm; margin-top: 3.4mm; border-radius: 1mm; background: var(--coral); }

    .when { margin-top: 6mm; display: flex; align-items: flex-end; gap: 6mm; }
    .date { display: flex; align-items: flex-start; gap: 2mm; font-family: var(--num); font-weight: 700; color: var(--ink); line-height: 0.82; }
    .date b { font-size: 30mm; font-weight: 700; letter-spacing: -0.01em; }
    .date i { display: grid; place-items: center; width: 10.5mm; height: 10.5mm; margin-top: 2mm; border-radius: 50%; background: linear-gradient(140deg, #e48a7d, #b9564c); color: #fff; font-family: var(--mincho); font-style: normal; font-size: 5.4mm; font-weight: 800; }
    .time { padding-bottom: 1.4mm; }
    .time b { display: block; font-family: var(--num); font-size: 12.5mm; font-weight: 700; line-height: 1; letter-spacing: 0.02em; color: var(--ink); }
    .time span { display: inline-block; margin-top: 2mm; padding: 0.8mm 3.6mm; border-radius: 99mm; background: var(--coral-soft); color: var(--coral-deep); font-size: 3.6mm; font-weight: 700; letter-spacing: 0.12em; }

    .info { margin-top: 7mm; display: grid; grid-template-columns: 1.25fr 1fr; gap: 4mm; width: 150mm; }
    .card { position: relative; padding: 4.2mm 5.5mm 4.4mm; border-radius: 6mm; background: #fff; box-shadow: 0 3mm 9mm rgba(120, 80, 60, 0.1); }
    .card-en { position: absolute; right: 4.5mm; top: 1.6mm; font-family: var(--script); font-size: 9mm; line-height: 1; color: rgba(217, 119, 107, 0.4); }
    .card-label { font-size: 3.2mm; font-weight: 700; letter-spacing: 0.3em; color: var(--coral-deep); }
    .card-value { margin-top: 1.4mm; font-family: var(--mincho); font-size: 8.4mm; font-weight: 800; line-height: 1.15; color: var(--ink); white-space: nowrap; }
    .card-value .num { font-family: var(--num); font-size: 1.32em; font-weight: 700; letter-spacing: 0.01em; }
    .card-value small { font-size: 0.62em; margin-left: 0.5mm; }

    /* ---------- 右: 写真(アーチ型)・ひとこと・3つの価値 ---------- */
    .visual { position: absolute; right: 18mm; top: 13mm; width: 92mm; }
    .arch { position: relative; width: 92mm; height: 118mm; border-radius: 46mm 46mm 7mm 7mm; padding: 2.2mm; background: #fff; box-shadow: 0 5mm 14mm rgba(120, 80, 60, 0.18); }
    .arch::after { content: ""; position: absolute; inset: -3.4mm; border-radius: 49.4mm 49.4mm 10mm 10mm; border: 0.35mm solid rgba(217, 119, 107, 0.45); pointer-events: none; }
    .arch img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; border-radius: 43.8mm 43.8mm 5mm 5mm; }
    .arch-script { position: absolute; left: -15mm; top: 8mm; font-family: var(--script); font-size: 15mm; line-height: 1; color: var(--coral); transform: rotate(-8deg); text-shadow: 0 0.6mm 0 #fff, 0 0 2mm rgba(255, 255, 255, 0.9); }
    .bubble { position: absolute; left: -30mm; bottom: 13mm; padding: 4.4mm 5.6mm; border-radius: 5mm; background: rgba(255, 255, 255, 0.96); border: 0.3mm solid rgba(217, 119, 107, 0.3); font-family: var(--mincho); font-size: 5.4mm; font-weight: 800; line-height: 1.5; letter-spacing: 0.06em; color: var(--ink); }
    .bubble em { font-style: normal; color: var(--coral-deep); }
    .bubble::before { content: ""; position: absolute; left: 0; top: 4.4mm; bottom: 4.4mm; width: 0.9mm; border-radius: 1mm; background: var(--coral); }

    .values { position: absolute; right: 14mm; bottom: 11mm; display: flex; gap: 4.2mm; }
    .value { display: grid; place-items: center; align-content: center; gap: 1.3mm; width: 31mm; height: 31mm; border-radius: 50%; background: #fff; box-shadow: 0 2.5mm 8mm rgba(120, 80, 60, 0.12); text-align: center; position: relative; }
    .value::after { content: ""; position: absolute; inset: 1.4mm; border-radius: 50%; border: 0.3mm dashed rgba(217, 119, 107, 0.4); }
    .value svg { width: 9mm; height: 9mm; fill: none; stroke: var(--coral-deep); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .value p { font-size: 3.05mm; font-weight: 700; line-height: 1.45; color: var(--ink); }

    .foot { position: absolute; left: 20mm; bottom: 9mm; display: flex; align-items: center; gap: 3mm; font-size: 2.8mm; font-weight: 700; letter-spacing: 0.2em; color: var(--sub); }
    .foot::before { content: ""; width: 10mm; height: 0.3mm; background: var(--coral); }

    /* 長い文字は枠に入るように小さくする(JS)。入りきらないまま切れないように */
    .card-value, .catch { overflow: hidden; }
    .info > .card { min-width: 0; }
    .title-en { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
    /* 定例会: 題・キャッチの大きさと位置 */
    .is-regular .title-en { font-size: 38mm; }
    .is-regular .title-fes { left: 66mm; top: 36mm; font-size: 21mm; }
    .is-regular .catch { max-width: 128mm; letter-spacing: 0.14em; font-size: 5.6mm; }
    .catch { white-space: nowrap; }
    .time span[hidden], .kicker[hidden] { display: none; }
    /* 定例会: 写真の代わりに、ロゴと新潟⇔東京の航路のイラスト */
    .arch.is-illust .illust { position: relative; width: 100%; height: 100%; border-radius: 43.8mm 43.8mm 5mm 5mm; overflow: hidden;
      background: radial-gradient(90% 70% at 50% 18%, #fff 0%, #fdf1ed 45%, #f6d9d2 100%); }
    .arch .illust-mark { position: absolute; left: 50%; top: 12mm; width: 38mm; height: 38mm; transform: translateX(-50%); object-fit: contain; border-radius: 0; filter: drop-shadow(0 3mm 6mm rgba(120, 70, 60, 0.3)); }
    .illust-route { position: absolute; left: 6mm; right: 6mm; bottom: 38mm; width: calc(100% - 12mm); height: 40mm; overflow: visible; }
    .illust-route .rt { fill: none; stroke: var(--coral); stroke-width: 1.4; stroke-dasharray: 2.5 3.5; stroke-linecap: round; }
    .illust-route .pin { fill: var(--coral-deep); }
    .illust-route .plane { fill: var(--coral-deep); }
    .illust-route text { font-family: var(--mincho); font-weight: 800; font-size: 16px; fill: var(--ink); letter-spacing: 1px; }
    .illust-route .en { font-family: var(--script); font-weight: 400; font-size: 19px; fill: var(--coral); letter-spacing: 0; }
    .illust-leaf { position: absolute; width: 30mm; fill: none; stroke: #e2a497; stroke-width: 1; opacity: 0.7; }
    .illust-leaf.is-a { left: -4mm; top: 46mm; }
    .illust-leaf.is-b { right: -6mm; top: 30mm; transform: scaleX(-1); stroke: #93b59b; }
    /* 「BT-EX」の「-」は、書体の斜めの線ではなく、まっすぐな横棒に。「!」もまっすぐな形(ゴシック)に */
    .hy { display: inline-block; width: 0.3em; height: 0.075em; margin: 0 0.04em 0 0.03em; vertical-align: 0.3em; border-radius: 0.02em; background: currentColor; }
    .title-en .hy { background: #33251f; }
    .ex { font-family: var(--sans); font-weight: 900; font-style: normal; margin-left: 0.05em; }
  </style>
</head>
<body>
  <div class="stage-wrap" id="wrap"><div class="stage" id="stage">
  <article class="poster" id="poster">
    <div class="wash"></div>
    <div class="dots"></div>
    <svg class="leaf is-tl" viewBox="0 0 200 200" aria-hidden="true"><path d="M10 6c40 30 70 66 92 112s34 70 40 80"/><path d="M48 34c-4-18 8-34 26-36 2 18-8 32-26 36Z"/><path d="M48 34c18-4 34 6 36 24-18 2-32-6-36-24Z"/><path d="M76 74c-2-20 12-34 30-34 0 20-12 32-30 34Z"/><path d="M76 74c20-2 34 10 34 28-20 0-32-10-34-28Z"/><path d="M100 120c0-20 14-32 32-30-2 20-14 30-32 30Z"/><path d="M100 120c18 2 30 14 28 32-18-2-28-14-28-32Z"/><path d="M28 18c-14-6-26 0-30 12 14 6 26 0 30-12Z"/></svg>
    <svg class="leaf is-bl" viewBox="0 0 200 200" aria-hidden="true"><path d="M20 196c20-40 34-84 38-128S56 14 52 2"/><path d="M56 60c20-14 42-10 50 6-20 12-40 8-50-6Z"/><path d="M58 100c22-8 42 2 46 18-22 8-40-2-46-18Z"/><path d="M50 140c22-4 40 8 42 24-22 4-40-8-42-24Z"/><path d="M54 60c-20-14-42-8-50 8 20 12 42 8 50-8Z"/><path d="M56 102c-20-12-44-8-52 8 20 12 44 8 52-8Z"/></svg>
    <svg class="leaf is-r" viewBox="0 0 120 200" aria-hidden="true"><path d="M110 6C80 40 66 86 62 130s-2 56 4 66"/><path d="M84 48c-16-6-32 2-36 16 16 6 32-2 36-16Z"/><path d="M72 92c-16-4-30 6-32 20 16 4 30-6 32-20Z"/><path d="M84 48c6-14 20-20 32-14-6 14-20 20-32 14Z"/></svg>

    <section class="main">
      <div class="brand"><img src="../../assets/bt-ex5-mark-3d-512.png" alt=""><b>BT-<em>EX5</em></b><span>新潟・東京 紹介者制コミュニティ</span></div>
      <p class="kicker" id="kicker"></p>
      <h1 class="title">
        <span class="title-en" id="titleEn"></span>
        <span class="title-ja" id="titleJa"></span>
        <span class="title-fes" id="titleScript" aria-hidden="true"></span>
      </h1>
      <p class="catch" id="catch"></p>
      <div class="when">
        <p class="date"><b id="date"></b><i id="wday"></i></p>
        <p class="time"><b id="time"></b><span id="open"></span></p>
      </div>
      <div class="info">
        <div class="card"><span class="card-en" aria-hidden="true">Place</span><p class="card-label">会場</p><p class="card-value" id="place"></p></div>
        <div class="card"><span class="card-en" aria-hidden="true">Fee</span><p class="card-label">参加費</p><p class="card-value" id="fee"></p></div>
      </div>
    </section>

    <section class="visual">
      <div class="arch" id="arch"></div>
      <p class="arch-script" id="archScript" aria-hidden="true"></p>
      <p class="bubble" id="bubble"></p>
    </section>

    <ul class="values" id="values" style="list-style:none"></ul>
  </article>
  </div></div>

  <script>
  (function () {
    "use strict";
    var q = new URLSearchParams(location.search);
    var kind = q.get("k") === "regular" ? "regular" : "fes";
    // はじめの値(何も渡さずに開いたとき)
    var DEF = {
      fes: { no: "1", date: "2026-12-02", start: "14:30", end: "16:30", open: "14:00", place: "銀座 Blossom", fee: "2,200円" },
      regular: { no: "8", date: "2026-11-14", start: "20:00", end: "22:00", open: "", place: "オンライン(Zoom)", fee: "会員 無料" },
    }[kind];
    function v(k) { var x = q.has(k) ? q.get(k) : DEF[k]; return String(x == null ? "" : x).trim(); }
    var $ = function (id) { return document.getElementById(id); };
    var KANJI = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
    function kanjiNum(n) { return n < 10 ? KANJI[n] : n < 100 ? (n >= 20 ? KANJI[Math.floor(n / 10)] : "") + "十" + KANJI[n % 10] : String(n); }
    function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    // 英字・数字のまとまりは、数字の書体(Cormorant)で
    function latin(t) { return esc(t).replace(/[A-Za-z0-9][A-Za-z0-9 .,:'&-]*/g, function (m) { return '<span class="num">' + m + "</span>"; }); }

    // 回
    var no = parseInt(v("no").replace(/[^0-9]/g, ""), 10);
    $("kicker").textContent = no > 0 ? "第" + kanjiNum(no) + "回" : "";
    $("kicker").hidden = !(no > 0);
    // 日付と曜日
    var dm = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v("date"));
    if (dm) {
      var wd = new Date(Date.UTC(+dm[1], +dm[2] - 1, +dm[3])).getUTCDay();
      $("date").textContent = (+dm[2]) + "/" + (+dm[3]);
      $("wday").textContent = "日月火水木金土"[wd];
    } else { $("date").textContent = v("date"); $("wday").hidden = true; }
    $("time").textContent = v("start") + (v("end") ? "〜" + v("end") : "");
    $("open").textContent = v("open") ? v("open") + " 受付" : "";
    $("open").hidden = !v("open");
    $("place").innerHTML = latin(v("place"));
    // 参加費: 数字だけなら「2,200円」の形に
    var fee = v("fee"), fm = /^([0-9０-９,，]+)\s*円?$/.exec(fee);
    if (fm) {
      var n = parseInt(fm[1].replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); }).replace(/[,，]/g, ""), 10);
      $("fee").innerHTML = '<span class="num">' + n.toLocaleString("ja-JP") + "</span><small>円</small>";
    } else $("fee").innerHTML = latin(fee);

    var ICON = {
      people: '<circle cx="9" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.6"/><path d="M3 19c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2"/><path d="M14.6 14.2c.6-.2 1.2-.3 1.9-.3 2.4 0 4.2 1.5 4.6 4.3"/>',
      bulb: '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3Z"/><path d="M12 7.5v3l1.6 1"/>',
      chart: '<path d="M4 20h16"/><path d="M6.5 16.5v-3"/><path d="M11 16.5v-6"/><path d="M15.5 16.5v-8"/><path d="M5 10.5 10 6l3.5 2.5L19 4"/><path d="M15.5 4H19v3.5"/>',
      calendar: '<rect x="4.5" y="5.5" width="15" height="14" rx="2"/><path d="M4.5 10h15"/><path d="M8.5 3.5v4"/><path d="M15.5 3.5v4"/><path d="M8.5 14h.01"/><path d="M12 14h.01"/><path d="M15.5 14h.01"/>',
      route: '<circle cx="6" cy="17" r="2"/><circle cx="18" cy="7" r="2"/><path d="M7.6 15.8C10 11 13 9 16.2 8"/><path d="M14 17h5"/><path d="M5 7h5"/>',
      talk: '<path d="M4.5 6.5h9a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H9l-3 2.5v-2.5H4.5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Z"/><path d="M15.5 9.5h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1v2.5l-3-2.5h-2.5"/>',
    };
    var C = kind === "fes" ? {
      en: "BT-EX", ja: "フェス", script: "Fes", catchText: "つながりが、未来を動かす",
      arch: '<img src="../fes-poster/photo.jpg" alt="銀座の夜景と、交流する経営者たち">', archScript: "Welcome",
      bubble: "<em>経営者、事業者</em>の<br>集まる会です<span class=\"ex\">!</span>",
      values: [["people", "経営者同士の<br>つながり"], ["bulb", "新たな<br>ビジネスの創出"], ["chart", "共に描く<br>未来の可能性"]],
    } : {
      en: "BT-EX5", ja: "定例会", script: "Meeting", catchText: "日本海側最大のマーケット 新潟⇔東京",
      arch: '<div class="illust"><svg class="illust-leaf is-a" viewBox="0 0 120 200" aria-hidden="true"><path d="M110 6C80 40 66 86 62 130s-2 56 4 66"/><path d="M84 48c-16-6-32 2-36 16 16 6 32-2 36-16Z"/><path d="M72 92c-16-4-30 6-32 20 16 4 30-6 32-20Z"/></svg><svg class="illust-leaf is-b" viewBox="0 0 120 200" aria-hidden="true"><path d="M110 6C80 40 66 86 62 130s-2 56 4 66"/><path d="M84 48c-16-6-32 2-36 16 16 6 32-2 36-16Z"/><path d="M72 92c-16-4-30 6-32 20 16 4 30-6 32-20Z"/></svg>'
        + '<img class="illust-mark" src="../../assets/bt-ex5-mark-3d-512.png" alt="BT-EX5">'
        + '<svg class="illust-route" viewBox="0 0 300 140" aria-hidden="true"><path class="rt" d="M40 110 C 90 20, 210 20, 260 110"/><circle class="pin" cx="40" cy="110" r="5"/><circle class="pin" cx="260" cy="110" r="5"/>'
        + '<path class="plane" transform="translate(150 40) rotate(8) scale(0.9)" d="M-12 0 L10 -3 L14 0 L10 3 Z M-2 -1 L-6 -10 L-2 -10 L4 -1 Z M-2 1 L-6 10 L-2 10 L4 1 Z M-10 -1 L-13 -5 L-11 -5 L-7 -1 Z M-10 1 L-13 5 L-11 5 L-7 1 Z"/>'
        + '<text x="40" y="136" text-anchor="middle">新潟</text><text x="260" y="136" text-anchor="middle">東京</text><text class="en" x="40" y="94" text-anchor="middle">Niigata</text><text class="en" x="260" y="94" text-anchor="middle">Tokyo</text></svg></div>',
      archScript: "Welcome",
      bubble: "<em>新潟と東京の経営者</em>が<br>集まる会です<span class=\"ex\">!</span>",
      values: [["calendar", "月2回の<br>定例会"], ["route", "会員拡大活動<br>&amp; 市場取り活動"], ["talk", "1on1<br>ミーティング"]],
    };
    $("titleEn").innerHTML = esc(C.en).replace("-", '<span class="hy" aria-hidden="true"></span>');
    $("titleEn").setAttribute("aria-label", C.en);
    $("titleJa").textContent = C.ja;
    $("titleScript").textContent = C.script;
    $("catch").textContent = C.catchText;
    // 写真: アプリの「資料」で入れかえた写真(この端末に保存)があれば、それを使う(定例会はイラストの代わりに)
    var PHOTO_KEY = "btex5-poster-photo-" + kind;
    // url: 写真(data URL)/ なし: この端末に保存した写真(なければ元の写真・イラスト)/ null: 元の写真・イラスト
    function setPhoto(url) {
      var custom = url === null ? "" : url || "";
      if (url === undefined) { try { custom = localStorage.getItem(PHOTO_KEY) || ""; } catch (e) { custom = ""; } }
      if (custom) {
        $("arch").innerHTML = '<img alt="">';
        $("arch").firstChild.src = custom;
        $("arch").classList.remove("is-illust");
      } else {
        $("arch").innerHTML = C.arch;
        $("arch").classList.toggle("is-illust", kind === "regular");
      }
    }
    setPhoto(q.get("photo") === "default" ? null : undefined);
    $("archScript").textContent = C.archScript;
    $("bubble").innerHTML = C.bubble;
    $("values").innerHTML = C.values.map(function (x) { return '<li class="value"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[x[0]] + "</svg><p>" + x[1] + "</p></li>"; }).join("");
    document.title = (no > 0 ? "第" + kanjiNum(no) + "回 " : "") + (kind === "fes" ? "BT-EX フェス" : "BT-EX5 定例会") + " ポスター";
    $("poster").classList.toggle("is-regular", kind === "regular");

    // 長い文字(会場・参加費・キャッチ)は、枠に入るまで小さくする
    function fit(el, min) {
      el.style.fontSize = "";
      var size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && size > min && guard++ < 60) { size *= 0.95; el.style.fontSize = size + "px"; }
    }
    // 画面の幅に合わせて縮める(印刷・画像は原寸)
    var embed = q.get("embed") === "1";
    document.body.classList.toggle("is-embed", embed);
    function scale() {
      var stage = $("stage"), wrap = $("wrap");
      var w = stage.offsetWidth, h = stage.offsetHeight;
      var avail = embed ? window.innerWidth : Math.max(200, window.innerWidth - 32);
      var s = Math.min(1, avail / w);
      stage.style.transform = s < 1 ? "scale(" + s + ")" : "";
      wrap.style.height = s < 1 ? (h * s + (embed ? 0 : 32)) + "px" : "";
      stage.style.marginBottom = "";
    }
    function layout() { fit($("place"), 14); fit($("fee"), 14); fit($("catch"), 12); scale(); }
    window.addEventListener("resize", scale);
    var ready = (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
      return Promise.all([].slice.call(document.images).map(function (im) { return im.decode ? im.decode().catch(function () {}) : null; }));
    }).then(function () { layout(); });
    layout();

    // 画像にするときの文字の形: ポスターで使っている文字の入った分(unicode-range)だけを読みこんで埋めこむ
    // (日本語の書体は細かく分かれているので、全部を埋めこむと重くなりすぎる)
    function usedFontCSS() {
      var link = document.querySelector('link[href^="https://fonts.googleapis.com"]');
      if (!link) return Promise.resolve("");
      var cps = [];
      Array.from($("poster").textContent + "0123456789:/〜円・").forEach(function (ch) { var c = ch.codePointAt(0); if (cps.indexOf(c) < 0) cps.push(c); });
      function hit(range) {
        return range.split(",").some(function (r) {
          r = r.trim().replace(/^U\+/i, "");
          var ab = r.split("-"), a = ab[0], b = ab[1];
          if (a.indexOf("?") >= 0) { b = a.replace(/\?/g, "F"); a = a.replace(/\?/g, "0"); }
          var lo = parseInt(a, 16), hi = parseInt(b || a, 16);
          return cps.some(function (c) { return c >= lo && c <= hi; });
        });
      }
      return fetch(link.href).then(function (r) { return r.text(); }).then(function (css) {
        var blocks = (css.match(/@font-face\s*\{[^}]*\}/g) || []).filter(function (b) {
          var m = /unicode-range:\s*([^;]+);/.exec(b);
          return !m || hit(m[1]);
        });
        return Promise.all(blocks.map(function (b) {
          var u = /url\(([^)]+)\)/.exec(b);
          if (!u) return b;
          return fetch(u[1].replace(/["']/g, "")).then(function (r) { return r.blob(); }).then(function (blob) {
            return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(b.replace(u[0], "url(" + fr.result + ")")); }; fr.readAsDataURL(blob); });
          });
        }));
      }).then(function (list) { return list.join("\n"); }).catch(function () { return ""; });
    }

    // 印刷(PDF で保存)・画像(PNG)で保存
    function fileName(ext) { return "bt-ex5-" + (kind === "fes" ? "fes" : "teireikai") + (no > 0 ? "-" + no : "") + "-" + (v("date") || "poster") + "." + ext; }
    window.BtexPoster = {
      print: function () { ready.then(function () { window.print(); }); },
      // opts.download: false のときは保存せずに画像(data URL)だけ返す(アプリの見本から使うとき、保存はアプリ側で)
      fileName: fileName,
      // 写真を入れかえる(アプリの「資料」から。null で元の写真に戻す)
      setPhoto: function (url) { setPhoto(url); layout(); },
      png: function (opts) {
        return ready.then(function () {
          return new Promise(function (res, rej) {
            if (window.htmlToImage) return res();
            var s = document.createElement("script"); s.src = "../../assets/vendor/html-to-image.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s);
          });
        }).then(function () {
          return usedFontCSS();
        }).then(function (fontCSS) {
          var stage = $("stage"), keep = stage.style.transform;
          stage.style.transform = "";
          var o = { backgroundColor: "#faf5f2", fontEmbedCSS: fontCSS || undefined };
          // iPhone・Mac の Safari は、1回目に写真が入らないことがある。小さく2回描いてから本番を描く
          var safari = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
          var warm = safari
            ? window.htmlToImage.toPng($("poster"), Object.assign({}, o, { pixelRatio: 0.4 })).then(function () { return window.htmlToImage.toPng($("poster"), Object.assign({}, o, { pixelRatio: 0.4 })); })
            : Promise.resolve();
          return warm.then(function () { return window.htmlToImage.toPng($("poster"), Object.assign({}, o, { pixelRatio: 3.125 })); }).then(function (url) {
            stage.style.transform = keep;
            if (!opts || opts.download !== false) { var a = document.createElement("a"); a.href = url; a.download = fileName("png"); document.body.appendChild(a); a.click(); a.remove(); }
            return url;
          }, function (e) { stage.style.transform = keep; throw e; });
        });
      },
    };
    if (q.get("print") === "1") window.BtexPoster.print();
    if (q.get("png") === "1") window.BtexPoster.png().catch(function () { alert("画像にできませんでした。「PDF で保存・印刷」をお使いください。"); });
  })();
  </script>
