<body>
  <main class="auth-main">
    <div class="auth-card">
      <a href="../referral/" class="auth-logo">
        <img class="brand-mark" src="../assets/bt-ex5-mark.svg?v=202610100656" alt="" width="40" height="40">
        <span class="brand-word"><span class="brand-name">BT-<em>EX5</em></span><span class="brand-sub">新潟・東京 紹介者制コミュニティ</span></span>
      </a>

      <h1>運営者ログイン</h1>
      <p class="auth-lead" id="login-lead">運営者用のパスコードを入力してください。</p>

      <!-- 手順1: 運営者用パスコード -->
      <form id="login-form" novalidate>
        <div class="auth-field">
          <label for="login-passcode">パスコード</label>
          <div class="password-row">
            <input type="password" id="login-passcode" name="passcode" autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <button type="button" class="password-toggle" data-toggle="login-passcode" aria-pressed="false" aria-label="表示する">表示</button>
          </div>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="login-remember" name="remember">
          <label for="login-remember">ログイン状態を保持する</label>
          <span class="remember-note">(オフ:12時間 / オン:30日)</span>
        </div>

        <button type="submit" id="login-submit" class="auth-submit" aria-busy="false">次へ</button>
      </form>

      <!-- 手順2: 名前を選ぶ -->
      <form id="member-form" novalidate hidden>
        <div class="auth-field">
          <label for="login-member">あなたのお名前</label>
          <select id="login-member" name="member" required></select>
        </div>
        <p class="member-note">選んだお名前で、紹介の記録と実績が集計されます。</p>
        <button type="submit" id="member-submit" class="auth-submit" aria-busy="false">はじめる</button>
        <button type="button" id="member-back" class="auth-text-btn">パスコードを入れ直す</button>
      </form>

      <div id="login-message" class="auth-message"></div>

      <p class="auth-help">名簿の管理・会員の招待・定例会の作成などを行う運営者のためのログインです。</p>
      <p class="auth-admin-link"><a href="../login/">会員の方のログインはこちら</a></p>
    </div>
  </main>

  <footer class="auth-footer">
    <a href="../opening/">オープニングムービー</a><a href="../terms/">利用規約</a>
